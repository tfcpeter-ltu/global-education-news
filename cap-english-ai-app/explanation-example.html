<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>詳細解析示範｜CAP English AI</title><link rel="stylesheet" href="/academic-theme.css?v=20261014-mock-groups-v1"><style>body{margin:0;font-family:system-ui,sans-serif}main{max-width:860px;margin:32px auto;padding:0 20px 40px}.card{padding:24px;margin-top:20px}h1{font-size:30px}.notice{color:#6c644f}#question{white-space:pre-line;line-height:1.8}#choices{display:grid;gap:10px;margin:18px 0}button{background:#fff9e8;border:1px solid #cfbd90;border-radius:8px;text-align:left;padding:12px 16px;font:inherit;cursor:pointer}button.selected{background:#eadfbf}.lp4ex{padding:20px;border-radius:12px;border:1px solid #d6c69d}a{color:#294b5b}</style></head><body data-academic="1"><main><a href="/">← 返回 CAP English AI</a><h1>看得懂，也能記得住的解析</h1><p class="notice">範例題：可選不同答案，比較對應的判斷與錯因。此頁不計分，也不修改你的學習紀錄。</p><section class="card"><div id="question"></div><div id="choices"></div></section><div id="explanation" class="lp4ex"></div></main><script src="/question-engine-v2.js?v=20261014-mock-groups-v1"></script><script src="/explanation-engine.js?v=20261014-mock-groups-v1"></script><script>
