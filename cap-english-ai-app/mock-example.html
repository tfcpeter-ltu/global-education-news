<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原創模考題組範例</title><link rel="stylesheet" href="/academic-theme.css?v=20261014-mock-groups-v1"><style>body{background:#f5edd5;color:#243d4a;font:16px/1.7 system-ui;margin:0}main{max-width:900px;margin:auto;padding:24px}button,select{font:inherit;padding:10px 14px;border:1px solid #bda36a;border-radius:9px;background:#fff9e9;color:#243d4a;cursor:pointer}#options{display:grid;gap:10px;margin:18px 0}.chosen{background:#dce9df}nav{display:flex;gap:12px;margin:16px 0}.exTeaching section{background:#fffaf0;padding:18px;margin:12px 0;border-radius:12px}.exOptions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.exOption{padding:14px;border:1px solid #d6c69d;border-radius:8px}.exCorrect{background:#e5f0e3}blockquote{border-left:3px solid #b59656;margin:10px 0;padding-left:15px}</style></head><body><main><a href="/">← 返回 CAP English AI</a><h1>原創模考大題組</h1><p>示範練習，不計分，也不寫入帳號學習紀錄。正式模考交卷前不會顯示答案。</p><label>題組 <select id="groups"></select></label><div id="question"></div><div id="options"></div><nav><button id="prev">上一題</button><button id="next">下一題</button><button id="explain">查看詳解</button></nav><div id="teaching"></div><p>以國中閱讀程度設計，參考會考的題組形式。所有文章與選項為本站原創，並非官方試題。</p></main><script src="/mock-groups.js?v=20261014-mock-groups-v1"></script><script src="/explanation-engine.js?v=20261014-mock-groups-v1"></script><script>
let gi=2,idx=0,selected=null;const bank=LTUMockGroups.groups,sel=document.getElementById('groups');bank.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.title;sel.append(o)});sel.value=gi;function draw(){const q=bank[gi].questions[idx];document.getElementById('question').innerHTML=LTUMockGroups.panel(q);const opts=document.getElementById('options');opts.replaceChildren();q.options.forEach((x,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+x;b.className=selected===i?'chosen':'';b.onclick=()=>{selected=i;draw()};opts.append(b)});document.getElementById('teaching').replaceChildren();document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===3;}sel.onchange=()=>{gi=Number(sel.value);idx=0;selected=null;draw()};document.getElementById('prev').onclick=()=>{idx--;selected=null;draw()};document.getElementById('next').onclick=()=>{idx++;selected=null;draw()};document.getElementById('explain').onclick=()=>{document.getElementById('teaching').innerHTML=LTUExplanation.render(bank[gi].questions[idx],selected)};draw();
</script></body></html>
