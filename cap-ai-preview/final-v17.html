<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜營運準備 V17</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v16" src="./final-v16.html?v=17"></iframe><script>
(function(){
const root=document.getElementById('v16');
function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<20;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}
function apiBase(){return location.hostname.includes('raw.githack.com')?'':location.origin}
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function addStyle(d){if(d.getElementById('v17style'))return;const s=d.createElement('style');s.id='v17style';s.textContent=`#systemV17{scroll-margin-top:80px}.systemHero{background:linear-gradient(135deg,#102a4c,#183f73);color:#fff;border-radius:18px;padding:18px;margin:18px 0}.systemHero h2{margin:0 0 6px}.systemGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sysCard{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:13px}.sysCard h4{margin:0 0 6px;color:#102a4c}.sysPill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#eef3ff;color:#3158ba}.sysPill.ok{background:#e8f7ef;color:#176647}.sysPill.bad{background:#fff1f1;color:#a33}.sysTable{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.sysTable td{padding:7px;border-top:1px solid #edf1f5}.sysNote{font-size:11px;color:#657386;line-height:1.7;margin-top:10px}@media(max-width:760px){.systemGrid{grid-template-columns:1fr}}`;d.head.appendChild(s)}
function mount(d){if(d.getElementById('systemV17'))return;const target=d.getElementById('accountV16')||d.getElementById('plans')||d.querySelector('main');if(!target)return;const sec=d.createElement('section');sec.id='systemV17';sec.className='section';sec.innerHTML=`<div class="systemHero"><h2>營運系統狀態</h2><p style="margin:0;color:#d9e6f5">資料庫、會員、藍新金流都通過檢查後，才建議開啟正式收款。</p></div><div class="systemGrid"><div class="sysCard"><h4>PostgreSQL</h4><div id="dbStateV17"><span class="sysPill">檢查中</span></div></div><div class="sysCard"><h4>會員資料表</h4><div id="schemaStateV17"><span class="sysPill">檢查中</span></div></div><div class="sysCard"><h4>藍新金流</h4><div id="payStateV17"><span class="sysPill">檢查中</span></div></div></div><div class="sysCard" style="margin-top:10px"><h4>上線檢查</h4><div id="checksV17">讀取中…</div><div class="sysNote">安全設計：頁面只顯示「是否已設定」，永遠不顯示 MerchantID、HashKey、HashIV 的實際內容。</div></div>`;target.parentNode.insertBefore(sec,target);const nav=d.querySelector('.links');if(nav&&!d.getElementById('systemNavV17')){const a=d.createElement('a');a.id='systemNavV17';a.href='#systemV17';a.textContent='系統狀態';nav.appendChild(a)}refresh(d)}
function badge(ok,yes,no){return `<span class="sysPill ${ok?'ok':'bad'}">${ok?yes:no}</span>`}
async function refresh(d){const db=d.getElementById('dbStateV17'),sc=d.getElementById('schemaStateV17'),pay=d.getElementById('payStateV17'),checks=d.getElementById('checksV17');if(!apiBase()){db.innerHTML=badge(false,'已連線','預覽模式');sc.innerHTML=badge(false,'已完成','需 Vercel');pay.innerHTML=badge(false,'已設定','需 Vercel');checks.innerHTML='<p>RawGitHack 只提供畫面預覽。正式系統狀態必須從 Vercel 網址讀取。</p>';return}try{const r=await fetch('/api/system/status',{credentials:'include'});const x=await r.json();db.innerHTML=badge(x.databaseConnected,'已連線','未連線');sc.innerHTML=badge(x.schemaReady,'已完成','尚未初始化');pay.innerHTML=badge(x.paymentConfigured,'已設定','尚未完成');const names=['DATABASE_URL','NEWEBPAY_MERCHANT_ID','NEWEBPAY_HASH_KEY','NEWEBPAY_HASH_IV','APP_BASE_URL'];checks.innerHTML=`<div>${badge(x.ready,'可進行付款測試','尚未可收款')} <span style="font-size:12px;margin-left:8px">模式：${esc(x.paymentMode||'test')}</span></div><table class="sysTable">${names.map(n=>`<tr><td>${n}</td><td>${x.checks&&x.checks[n]?'✓ 已設定':'— 未設定'}</td></tr>`).join('')}</table>`}catch(e){db.innerHTML=badge(false,'已連線','API 未連線');sc.innerHTML=badge(false,'已完成','無法檢查');pay.innerHTML=badge(false,'已設定','無法檢查');checks.innerHTML='<p>尚未部署 V17 API，或正式網域尚未連接。</p>'}}
function boot(){const d=deepest();if(!d)return;addStyle(d);mount(d);d.title='2027 會考英文 AI｜營運準備 V17'}
root.addEventListener('load',()=>{setTimeout(boot,1000);setTimeout(boot,2600)});setInterval(boot,4000)
})();
</script></body></html>
