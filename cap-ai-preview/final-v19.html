<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜LTU 國際學術中心</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v18" src="./final-v18.html?v=22-product-core-v2"></iframe><script>
(function(){
'use strict';const root=document.getElementById('v18');
function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<30;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch{return null}}
async function me(){try{const r=await fetch('/api/auth/me',{credentials:'include'});return r.ok?await r.json():null}catch{return null}}
function complete(x){if(!x?.authenticated)return false;const u=x.user||{},exp=u.expiresAt?new Date(u.expiresAt).getTime():null;return String(u.membershipPlan||'').toLowerCase()==='complete'&&String(u.membershipStatus||'active').toLowerCase()==='active'&&(!exp||exp>Date.now())}
function style(d){if(d.getElementById('v19stable'))return;const s=d.createElement('style');s.id='v19stable';s.textContent=`.top nav{max-width:1180px!important;padding:10px 22px!important;gap:16px!important}.top .links{display:none!important}.v19nav{display:flex;align-items:center;gap:4px;margin-left:auto}.v19nav a,.v19nav button{border:0;background:transparent;color:#516276;text-decoration:none;font-size:13px;font-weight:700;padding:9px 11px;border-radius:999px;cursor:pointer}.v19nav a:hover,.v19nav button:hover{background:#f3f6f9;color:#102a4c}.v19dropWrap{position:relative}.v19drop{display:none;position:absolute;right:0;top:43px;width:260px;background:#fff;border:1px solid #e3eaf1;border-radius:17px;box-shadow:0 18px 45px #102a4c22;padding:7px;z-index:1000}.v19drop.show{display:block}.v19drop button{display:flex;justify-content:space-between;width:100%;text-align:left}.v19drop small{color:#176df3}.top .navbtn{border-radius:999px!important}@media(max-width:760px){.v19nav>a{display:none}.v19drop{position:fixed;left:10px;right:10px;top:58px;width:auto}}`;d.head.appendChild(s)}
function goto(d,id){const el=d.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function safeText(d){const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(!n.nodeValue)continue;n.nodeValue=n.nodeValue.replace(/免費會員每天\s*[45]\s*題/g,'免費會員每天 3 題').replace(/Free 每日\s*[45]\s*題/g,'Free 每日 3 題').replace(/今日免費\s*[45]\s*題/g,'今日免費 3 題')}}
async function boot(){const d=deepest();if(!d?.body)return;style(d);safeText(d);const x=await me(),isPaid=complete(x),nav=d.querySelector('.top nav');if(!nav)return;let box=d.getElementById('v19nav');if(!box){box=d.createElement('div');box.id='v19nav';box.className='v19nav';box.innerHTML=`<a href="#">首頁</a><button data-v19="free">免費 3 題</button><div class="v19dropWrap"><button data-v19="menu">完整會員⌄</button><div class="v19drop"><button data-go="practice"><span>AI 記憶出題</span><small>01</small></button><button data-go="notes"><span>AI 筆記</span><small>02</small></button><button data-go="weekly"><span>每週模考</span><small>03</small></button><button data-go="history"><span>歷屆題</span><small>04</small></button><button data-go="analysis"><span>弱點分析</span><small>05</small></button></div></div>`;const acc=nav.querySelector('.navbtn');nav.insertBefore(box,acc||null);box.querySelector('a').onclick=e=>{e.preventDefault();goto(d,'pcoreMembership')};box.querySelector('[data-v19=free]').onclick=()=>window.top.dispatchEvent(new CustomEvent('ltu:start-practice',{detail:{mode:'core'}}));const drop=box.querySelector('.v19drop');box.querySelector('[data-v19=menu]').onclick=e=>{e.stopPropagation();drop.classList.toggle('show')};d.addEventListener('click',()=>drop.classList.remove('show'));box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{drop.classList.remove('show');if(box.dataset.paid!=='1'){goto(d,'pcoreMembership');return}const a=b.dataset.go;if(a==='practice')window.top.dispatchEvent(new CustomEvent('ltu:start-practice',{detail:{mode:'core'}}));else if(a==='notes'){const nb=d.querySelector('#ltuNotebookCompact .nbOpen');if(nb)nb.click();else goto(d,'accountV16')}else goto(d,a)})}box.dataset.paid=isPaid?'1':'0';box.querySelector('[data-v19=menu]').textContent=isPaid?'AI Complete⌄':'完整會員⌄';d.title='2027 會考英文 AI｜LTU 國際學術中心'}
root.addEventListener('load',()=>{setTimeout(boot,700);setTimeout(boot,1900)});setInterval(boot,4000)
})();
</script></body></html>
