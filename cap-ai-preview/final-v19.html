async function me(){try{const r=await fetch('/api/auth/me',{credentials:'include'});return r.ok?await r.json():null}catch(e){return null}}

function simplifyNav(d,isComplete){const old=d.querySelector('.top nav');if(!old)return;if(d.getElementById('simpleNavV19')){d.body.classList.toggle('v19-complete',isComplete);return}const links=old.querySelector('.links');if(links)links.style.display='none';const box=d.createElement('div');box.id='simpleNavV19';box.className='simpleNavV19';box.innerHTML=`<a href="#aiAppleHeroV18">首頁</a><a href="#daily">免費 3 題</a><div class="memberMenuWrapV19"><button class="completeMenuBtn">完整會員⌄</button><div class="completeMenuV19"></div></div>`;const account=old.querySelector('.navbtn');old.insertBefore(box,account||null);const menu=box.querySelector('.completeMenuV19');tools.forEach(([name,id,desc])=>{const b=d.createElement('button');b.innerHTML=`<span>${name}</span><small>${isComplete?'開啟':'範例'}</small>`;b.onclick=()=>{menu.classList.remove('show');if(isComplete)goto(d,id);else preview(d,name,desc)};menu.appendChild(b)});box.querySelector('.completeMenuBtn').onclick=(e)=>{e.stopPropagation();menu.classList.toggle('show')};d.addEventListener('click',()=>menu.classList.remove('show'));d.body.classList.toggle('v19-complete',isComplete)}
