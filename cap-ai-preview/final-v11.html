<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V11</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v10" src="./final-v10.html?v=11"></iframe><script>(function(){const root=document.getElementById('v10');const readDB=[{k:['main idea','主旨','best title','mostly about'],t:'主旨抓錯',why:'你可能被某一個細節吸引，卻沒有回頭看整段反覆出現的核心。',clue:'先看首尾句，再找重複出現的人、事、問題或目的。',next:'做主旨題時，先用一句中文說出「整篇都在談什麼」，再看選項。'},{k:['inference','infer','推論','imply','probably'],t:'過度推論',why:'你可能選了「合理但文章沒有證據」的答案。會考推論仍必須從文中線索推出，不能只靠常識。',clue:'把答案倒回文章，至少找到一到兩個支持線索；找不到就先排除。',next:'下一題只選「文章支持得住」的答案，不選你覺得現實生活可能發生的答案。'},{k:['reference','refer to','代名詞','it','they','this','that'],t:'代名詞指涉錯',why:'你可能只看代名詞前面最近的名詞，沒有檢查單複數、語意與整句邏輯。',clue:'往前找 1–2 句，確認單複數一致，再把候選名詞代回原句測試。',next:'看到 it / they / this / that，先圈起來，再找它真正代表的人、事或概念。'},{k:['detail','according to','細節','which is true'],t:'關鍵字漏看',why:'你可能沒有把題目關鍵字帶回原文定位，所以被相似資訊干擾。',clue:'先圈人名、數字、時間、地點與特殊名詞，再回文找同義改寫。',next:'細節題不要憑印象，先定位，再比對。'},{k:['not','except','least','不正確','不是'],t:'負向問句看漏',why:'你可能看懂文章，卻漏掉題幹中的 NOT / EXCEPT / least likely。',clue:'看到負向字先圈起來，最後再確認自己是在選「錯的那個」還是「對的那個」。',next:'負向題先把題幹改寫成中文，再作答。'},{k:['however','although','but','instead','yet','轉折'],t:'轉折訊號沒抓到',why:'你可能只讀到前半句，沒有發現作者在 but / however 之後改變方向。',clue:'but、however、although、instead、yet 後面的資訊通常更關鍵。',next:'看到轉折詞就畫記號，先問「前後意思哪裡反轉？」'},{k:['because','therefore','as a result','so','原因','結果'],t:'因果關係判斷錯',why:'你可能把原因和結果對調，或只看到同段出現就認為有因果。',clue:'找 because / so / therefore / as a result 等訊號，再確認哪件事先發生、哪件事是結果。',next:'讀完後用「因為___，所以___」重述一次。'},{k:['before','after','when','while','finally','first','then','時間'],t:'時間順序混亂',why:'你可能記住事件內容，卻把先後順序弄反。',clue:'圈出 before / after / first / then / finally 與時間點。',next:'事件多時，先在旁邊寫 1→2→3。'},{k:['attitude','tone','feel','作者態度','語氣'],t:'作者態度／語氣判斷錯',why:'你可能只看事件本身，沒有注意形容詞、語氣詞與作者最後的評價。',clue:'找帶情緒或評價的字，例如 luckily, unfortunately, surprisingly, glad, worried。',next:'先判斷正向／負向／中立，再細選態度。'},{k:['chart','table','graph','圖表','notice','schedule'],t:'圖表與文字沒有交叉比對',why:'你可能只看文字或只看表格，沒有把兩邊資訊一起比對。',clue:'先看欄位標題、單位、日期與例外條件，再回題幹找限制。',next:'圖表題至少做兩次比對：題幹→圖表→選項。'}];function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<12;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function detect(text){const t=String(text||'').toLowerCase();let best=null,score=0;readDB.forEach(x=>{let s=0;x.k.forEach(k=>{if(t.includes(String(k).toLowerCase()))s++});if(s>score){score=s;best=x}});return score?best:null}function save(x){let arr=[];try{arr=JSON.parse(localStorage.getItem('capAINotes')||'[]')}catch(e){};arr.push({type:'Reading Strategy',title:x.t,content:'錯因：'+x.why+'\n判斷線索：'+x.clue+'\n下一題策略：'+x.next,createdAt:new Date().toISOString(),source:'V11 閱讀診斷'});localStorage.setItem('capAINotes',JSON.stringify(arr));alert('已收進閱讀策略筆記：'+x.t)}function box(x){return '<div class="readingDiag"><div class="readingDiagHead">閱讀診斷｜'+esc(x.t)+'</div><div class="readingDiagGrid"><div><b>你可能卡在哪裡</b><p>'+esc(x.why)+'</p></div><div><b>文章真正要看的線索</b><p>'+esc(x.clue)+'</p></div><div><b>下一題立刻這樣做</b><p>'+esc(x.next)+'</p></div></div><button class="readingSave">收進閱讀策略筆記</button></div>'}function styles(d){if(d.getElementById('v11style'))return;const s=d.createElement('style');s.id='v11style';s.textContent='.readingDiag{margin-top:12px;border:1px solid #cfdcef;border-radius:14px;overflow:hidden;background:#fff}.readingDiagHead{background:linear-gradient(135deg,#173b68,#2762dd);color:#fff;padding:10px 12px;font-weight:900}.readingDiagGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.readingDiagGrid>div{background:#f7f9fc;border:1px solid #e3e9f1;border-radius:10px;padding:10px}.readingDiagGrid b{color:#102a4c;font-size:12px}.readingDiagGrid p{margin:5px 0 0;font-size:12px;line-height:1.65;color:#5d6979}.readingSave{margin:0 10px 10px;border:0;border-radius:9px;background:#eef3ff;color:#3158ba;padding:8px 10px;font-weight:850;cursor:pointer}.readingClinic{margin:14px 0}.readingClinicGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.readingClinicCard{border:1px solid #dce4ee;background:#fff;border-radius:13px;padding:12px}.readingClinicCard h4{margin:0 0 6px;color:#102a4c}.readingClinicCard p{font-size:11px;line-height:1.6;color:#66758b}.readingClinicCard button{border:0;border-radius:8px;background:#eef3ff;color:#3158ba;padding:7px 9px;font-weight:800}@media(max-width:760px){.readingDiagGrid,.readingClinicGrid{grid-template-columns:1fr}}';d.head.appendChild(s)}function enhance(d){[...d.querySelectorAll('.explain,.wrongItem,.diagnosisCard,.aiDiagnosis,.report,.modal .mbody,.examQ')].forEach(n=>{if(n.dataset.v11read)return;const x=detect(n.innerText);if(!x)return;n.dataset.v11read='1';n.insertAdjacentHTML('beforeend',box(x));const b=n.querySelector('.readingSave');if(b)b.onclick=()=>save(x)})}function clinic(d){if(d.getElementById('readingClinic'))return;const daily=d.getElementById('daily')||d.querySelector('main');if(!daily)return;const sec=d.createElement('section');sec.id='readingClinic';sec.className='section readingClinic';sec.innerHTML='<h2>閱讀錯因診斷中心</h2><p class="lead">不是只記「閱讀錯了」，而是辨認你是哪一種讀法出問題。</p><div class="readingClinicGrid">'+readDB.map((x,i)=>'<div class="readingClinicCard"><h4>'+esc(x.t)+'</h4><p>'+esc(x.next)+'</p><button data-r="'+i+'">收進策略筆記</button></div>').join('')+'</div>';daily.parentNode.insertBefore(sec,daily);sec.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>save(readDB[Number(b.dataset.r)]));const nav=d.querySelector('.links');if(nav){const a=d.createElement('a');a.href='#readingClinic';a.textContent='閱讀診斷';nav.appendChild(a)}}function boot(){const d=deepest();if(!d)return;styles(d);clinic(d);enhance(d);if(!d.defaultView.__v11obs){d.defaultView.__v11obs=true;new MutationObserver(()=>enhance(d)).observe(d.body,{childList:true,subtree:true})}d.title='2027 會考英文 AI｜完整產品 V11'}root.addEventListener('load',()=>{setTimeout(boot,900);setTimeout(boot,2200)});setInterval(boot,3000)})();</script></body></html>
