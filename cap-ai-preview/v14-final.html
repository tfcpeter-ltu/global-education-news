<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAP English AI V14｜完整會考模擬</title></head><body><div id="loading" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC',sans-serif;padding:56px 24px;text-align:center;color:#0b1f3a"><h2 style="margin:0 0 10px">CAP English AI V14</h2><p>正在載入 43 題閱讀＋21 題聽力完整模擬考…</p></div><script>(async()=>{try{const files=[1,2,3,4,5,6].map(i=>`v14-data-${i}.txt`);const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`${f} 載入失敗 (${r.status})`);return (await r.text()).trim()}));const b=parts.join('');const raw=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('此瀏覽器版本不支援測試頁解壓縮，請使用最新版 Chrome、Edge 或 Safari。');const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML=`<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:720px;margin:70px auto;padding:28px;color:#0b1f3a"><h2>V14 載入失敗</h2><p>${e.message}</p><button onclick="location.reload()" style="border:0;background:#2457d6;color:white;padding:11px 16px;border-radius:10px;font-weight:700">重新載入</button></div>`}})();</script></body></html>
