<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v11" src="./final-v11.html?v=12"></iframe><script>(function(){const root=document.getElementById('v11');const listenDB=[{k:['listening','聽力','keyword','detail'],t:'關鍵字漏聽',why:'你可能只聽到部分熟字，卻漏掉真正決定答案的人名、地點、動作或目的。',clue:'第一遍先抓 who / where / what happened；第二遍只確認題目要的那個資訊。',next:'不要試著逐字翻譯，先抓名詞、動詞與題幹關鍵詞。'},{k:['not','never','didn\'t','don\'t','isn\'t','否定'],t:'否定詞漏聽',why:'not、never、didn’t 等很短，若只抓後面的內容，很容易把意思聽反。',clue:'特別留意助動詞後面的 not，以及 never / hardly 等負向字。',next:'聽到助動詞時多停一拍，確認後面有沒有否定。'},{k:['time','date','number','數字','時間','日期','price'],t:'數字／時間／日期混淆',why:'teen / ty、星期、月份、時刻與價格很容易因聲音接近而混淆。',clue:'先判斷題目要的是日期、時間、數量還是價格，再只記那一類資訊。',next:'遇到數字題先在心中建立格式，例如 7:15、$35、March 12。'},{k:['he','she','they','person','人物','speaker'],t:'人物與代名詞搞錯',why:'對話中人物輪流說話，你可能把 he / she / they 指到錯的人。',clue:'先辨認每位說話者的角色，再追蹤代名詞代表誰。',next:'兩人對話先在心中標 A / B，不要只靠名字記憶。'},{k:['but','however','actually','instead','though','轉折'],t:'轉折訊號漏掉',why:'前半句可能只是背景，but / however / actually 後面才是答案真正所在。',clue:'聽到 but、however、actually、instead 時立刻提高注意力。',next:'第二遍播放時專門確認轉折後的資訊。'},{k:['attitude','tone','feel','happy','angry','worried','語氣','態度'],t:'語氣／態度誤判',why:'你可能只聽內容，沒有注意說話者的情緒詞、語調與最後一句反應。',clue:'留意 really? / great / too bad / I’m afraid / luckily 等態度訊號。',next:'先判斷正向、負向或中立，再選更細的情緒。'},{k:['response','reply','問答','question','answer'],t:'問答功能判斷錯',why:'基本問答不是逐字對應，而是要判斷對方「在問什麼功能」：時間、地點、原因、邀請、建議或意願。',clue:'先抓疑問詞與句型，例如 When / Where / Why / Would you / How about。',next:'先判斷題目功能，再看三個回答哪個真的能接話。'},{k:['overall','main idea','mostly about','整句','主旨'],t:'只抓單字，沒有理解整句',why:'你可能因為聽到選項裡的同一個單字就選它，但整句意思其實不同。',clue:'不要用「有聽到這個字」當答案證據，要確認主詞、動作與結果。',next:'至少抓到「誰＋做什麼＋結果」三個元素再作答。'},{k:['place','schedule','trip','location','地點','行程'],t:'地點／行程資訊配對錯',why:'你可能記住了所有地點，卻沒有分清楚「去哪裡、從哪裡來、何時去」。',clue:'把地點和動作綁在一起聽，例如 go to / leave from / meet at。',next:'第二遍時只追蹤行程順序與介系詞。'},{k:['distractor','same word','干擾','熟字'],t:'被熟字干擾選項帶走',why:'選項故意放入錄音中出現過的字，但真正答案常是同義改寫。',clue:'確認選項是否完整符合意思，而不只是「有聽到同一個字」。',next:'看到與錄音完全同字的選項，反而要多檢查一次。'}];function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<14;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function detect(text){const t=String(text||'').toLowerCase();let best=null,score=0;listenDB.forEach(x=>{let s=0;x.k.forEach(k=>{if(t.includes(String(k).toLowerCase()))s++});if(s>score){score=s;best=x}});return score?best:null}function save(x){let arr=[];try{arr=JSON.parse(localStorage.getItem('capAINotes')||'[]')}catch(e){};arr.push({type:'Listening Strategy',title:x.t,content:'錯因：'+x.why+'\n聽力線索：'+x.clue+'\n下一題策略：'+x.next,createdAt:new Date().toISOString(),source:'V12 聽力診斷'});localStorage.setItem('capAINotes',JSON.stringify(arr));alert('已收進聽力策略筆記：'+x.t)}function box(x){return '<div class="listenDiag"><div class="listenDiagHead">聽力診斷｜'+esc(x.t)+'</div><div class="listenDiagGrid"><div><b>你可能為什麼聽錯</b><p>'+esc(x.why)+'</p></div><div><b>下一次要聽什麼</b><p>'+esc(x.clue)+'</p></div><div><b>立刻可用的策略</b><p>'+esc(x.next)+'</p></div></div><button class="listenSave">收進聽力策略筆記</button></div>'}function styles(d){if(d.getElementById('v12style'))return;const s=d.createElement('style');s.id='v12style';s.textContent='.listenDiag{margin-top:12px;border:1px solid #cde1ea;border-radius:14px;overflow:hidden;background:#fff}.listenDiagHead{background:linear-gradient(135deg,#0f4c5c,#177e89);color:#fff;padding:10px 12px;font-weight:900}.listenDiagGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.listenDiagGrid>div{background:#f5fbfc;border:1px solid #dcebed;border-radius:10px;padding:10px}.listenDiagGrid b{color:#113f49;font-size:12px}.listenDiagGrid p{margin:5px 0 0;font-size:12px;line-height:1.65;color:#5d6979}.listenSave{margin:0 10px 10px;border:0;border-radius:9px;background:#e9f7f8;color:#14636c;padding:8px 10px;font-weight:850;cursor:pointer}.listenClinic{margin:14px 0}.listenClinicGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.listenClinicCard{border:1px solid #dce8ed;background:#fff;border-radius:13px;padding:12px}.listenClinicCard h4{margin:0 0 6px;color:#103d46}.listenClinicCard p{font-size:11px;line-height:1.6;color:#66758b}.listenClinicCard button{border:0;border-radius:8px;background:#e9f7f8;color:#14636c;padding:7px 9px;font-weight:800}@media(max-width:760px){.listenDiagGrid,.listenClinicGrid{grid-template-columns:1fr}}';d.head.appendChild(s)}function enhance(d){[...d.querySelectorAll('.explain,.wrongItem,.diagnosisCard,.aiDiagnosis,.report,.modal .mbody,.listenbox,.examQ')].forEach(n=>{if(n.dataset.v12listen)return;const txt=n.innerText;const lower=txt.toLowerCase();if(!(lower.includes('listen')||txt.includes('聽力')||lower.includes('speaker')||lower.includes('audio')))return;const x=detect(txt)||listenDB[0];n.dataset.v12listen='1';n.insertAdjacentHTML('beforeend',box(x));const b=n.querySelector('.listenSave');if(b)b.onclick=()=>save(x)})}function clinic(d){if(d.getElementById('listeningClinic'))return;const daily=d.getElementById('daily')||d.querySelector('main');if(!daily)return;const sec=d.createElement('section');sec.id='listeningClinic';sec.className='section listenClinic';sec.innerHTML='<h2>聽力錯因診斷中心</h2><p class="lead">「聽不懂」不是單一問題。系統會把錯因拆成資訊漏聽、語意判斷、語氣、時間數字與問答功能等不同能力。</p><div class="listenClinicGrid">'+listenDB.map((x,i)=>'<div class="listenClinicCard"><h4>'+esc(x.t)+'</h4><p>'+esc(x.why)+'</p><p><b>下次：</b>'+esc(x.next)+'</p><button data-l="'+i+'">收進聽力策略筆記</button></div>').join('')+'</div>';daily.parentNode.insertBefore(sec,daily);sec.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>save(listenDB[Number(b.dataset.l)]));const nav=d.querySelector('.links');if(nav&&!d.querySelector('a[href="#listeningClinic"]')){const a=d.createElement('a');a.href='#listeningClinic';a.textContent='聽力診斷';nav.appendChild(a)}}function boot(){const d=deepest();if(!d)return;styles(d);clinic(d);enhance(d);if(!d.defaultView.__v12obs){d.defaultView.__v12obs=true;new MutationObserver(()=>enhance(d)).observe(d.body,{childList:true,subtree:true})}d.title='2027 會考英文 AI｜完整產品 V12'}root.addEventListener('load',()=>{setTimeout(boot,900);setTimeout(boot,2200)});setInterval(boot,3000)})();</script></body></html>
