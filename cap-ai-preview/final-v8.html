<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v7" src="./final-v7.html?v=8"></iframe><script>
(function(){
const root=document.getElementById('v7');
function deepestDoc(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<12;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}
function boot(){const d=deepestDoc();if(!d){setTimeout(boot,250);return;} if(d.getElementById('v8GrammarLibrary'))return; d.title='2027 會考英文 AI｜完整產品 V8';
const css=d.createElement('style');css.textContent=`.diagLib{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.diagLib h3{margin:0 0 8px;color:var(--n)}.diagGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.diagItem{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fbfcfe}.diagItem b{color:var(--n);font-size:13px}.diagItem p{font-size:11px;color:var(--mut);line-height:1.6;margin:6px 0}.diagItem code{font-size:10px;background:#eef3ff;padding:3px 5px;border-radius:6px}.diagBad{background:#fff1f1;border-color:#e7b0b0}.diagGood{background:#eef9f4;border-color:#afd8c3}.diagMini{font-size:10px;color:#66758b}.grammarTabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.grammarTabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800}.grammarTabs button.on{background:var(--n);color:#fff}.grammarDetail{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.grammarDetail h4{margin:0 0 8px;color:var(--n)}.grammarDetail ul{margin:6px 0 0 18px;padding:0;font-size:12px;line-height:1.7;color:#536178}@media(max-width:800px){.diagGrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.diagGrid{grid-template-columns:1fr}}`;d.head.appendChild(css);
const lib={
'被動語態':{key:'be + p.p.',why:'看到動作卻忽略主詞是「接受動作」的一方。',v:'built 建造；made 製造；known 知名的',p:'be made of／be known for',g:'be 動詞依時態改變，主要動詞用過去分詞',s:'S + be + p.p. (+ by O)',clue:'先問：主詞是做動作，還是被做？'},
'比較級／最高級':{key:'-er / more / the -est / most',why:'只看到形容詞，沒有先找比較對象或範圍。',v:'than 比；among 在…之中',p:'much + 比較級／one of the + 最高級 + 複數名詞',g:'兩者比較用比較級；三者以上範圍常用最高級',s:'A is + 比較級 + than B',clue:'先找 than、of all、in the class 等範圍詞。'},
'關係代名詞':{key:'who / which / that',why:'沒有先判斷先行詞是人還是物，以及關係詞在子句中的角色。',v:'person 人；thing 事物',p:'the boy who…／the book which…',g:'人常用 who/that；物常用 which/that',s:'N + relative pronoun + V…',clue:'先圈出前面的名詞，再看後面子句少主詞還是受詞。'},
'動名詞／不定詞':{key:'V-ing vs to V',why:'把動詞後接形式當成語感題，沒有記固定搭配。',v:'enjoy 喜歡；decide 決定；finish 完成',p:'enjoy V-ing／decide to V／finish V-ing',g:'部分動詞固定接 V-ing，部分固定接 to V',s:'S + V + V-ing / to V',clue:'看到第一個動詞先回想它的固定搭配。'},
'連接詞':{key:'because / so / although / but',why:'只看單字意思，沒有判斷前後句是因果、轉折還是讓步。',v:'although 雖然；therefore 因此',p:'because + 子句／because of + N',g:'連接詞決定兩句的邏輯關係',s:'Although S+V, S+V.',clue:'先用中文說出前後兩句關係，再選連接詞。'},
'介系詞':{key:'in / on / at / for / since',why:'把介系詞當成逐字翻譯，忽略固定搭配與時間用法。',v:'during 在…期間；until 直到',p:'be good at／interested in／wait for',g:'時間、地點與固定搭配各有常用介系詞',s:'be + adj. + prep. + N/V-ing',clue:'若是固定搭配，優先用整組記憶。'},
'代名詞':{key:'it / they / one / ones / this / that',why:'沒有往前找真正被代替的名詞。',v:'refer to 指涉',p:'one of them／those who',g:'單複數與人稱必須和先行名詞一致',s:'N… pronoun…',clue:'代名詞題一定回前文找單複數與語意一致的名詞。'},
'時態混淆':{key:'now / yesterday / since / already / when',why:'先看動詞形式，沒有先抓時間線索。',v:'already 已經；yet 尚未；ago 以前',p:'have been to／used to',g:'現在、過去、現在完成、進行式要由時間線索判斷',s:'S + have/has + p.p. + since/for…',clue:'先圈時間副詞，再決定時態。'},
'條件句':{key:'if + present, will + V',why:'看到未來意思就兩邊都用了 will。',v:'unless 除非',p:'if possible／unless necessary',g:'第一條件句 if 子句通常用現在式，主句用 will + V',s:'If S + V(s), S + will + V.',clue:'看到 if 先分辨條件子句與結果子句。'},
'助動詞':{key:'can / must / should / may + V',why:'助動詞後仍用了三單或過去式。',v:'must 必須；may 可能',p:'had better + V／would rather + V',g:'助動詞後接原形動詞',s:'S + modal + V',clue:'看到 can/must/should/may，下一個動詞先回原形。'},
'詞性判斷':{key:'N / V / Adj / Adv',why:'只看字義相近，沒有看空格在句中的位置。',v:'success / successful / successfully',p:'be + adj.／V + adv.',g:'冠詞後常接名詞；be 後常接形容詞；動詞常由副詞修飾',s:'S + be + Adj. / V + Adv.',clue:'先判斷空格需要哪一種詞性，再選字。'}
};
const anchor=d.getElementById('daily')||d.querySelector('.section');if(anchor){const box=d.createElement('section');box.className='section';box.id='v8GrammarLibrary';box.innerHTML=`<div class="diagLib"><h3>AI 錯因資料庫｜國中文法高頻失分</h3><p class="lead" style="font-size:13px">學生答錯後，系統會先辨識屬於哪一類，再用相同結構拆成：錯因、單字、片語、文法、句型、錯誤選項、判斷線索與變式再練。</p><div class="grammarTabs" id="grammarTabs"></div><div class="grammarDetail" id="grammarDetail"></div></div>`;anchor.parentNode.insertBefore(box,anchor);const tabs=box.querySelector('#grammarTabs'),detail=box.querySelector('#grammarDetail');const names=Object.keys(lib);function show(name){[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.n===name));const x=lib[name];detail.innerHTML=`<h4>${name} <span class="badge">${x.key}</span></h4><div class="diagGrid"><div class="diagItem diagBad"><b>你可能錯在</b><p>${x.why}</p></div><div class="diagItem"><b>單字 Vocabulary</b><p>${x.v}</p></div><div class="diagItem"><b>片語 Phrase</b><p>${x.p}</p></div><div class="diagItem"><b>文法 Grammar</b><p>${x.g}</p></div><div class="diagItem"><b>句型 Sentence Pattern</b><p><code>${x.s}</code></p></div><div class="diagItem diagGood"><b>正確判斷線索</b><p>${x.clue}</p></div></div>`} names.forEach((n,i)=>{const b=d.createElement('button');b.textContent=n;b.dataset.n=n;b.onclick=()=>show(n);tabs.appendChild(b);if(i===0)show(n)});}
// Enhance existing explanation blocks by appending classification when a likely grammar keyword is found.
function detect(text){text=(text||'').toLowerCase();if(/passive|被動|p\.p\.|was made|were built/.test(text))return '被動語態';if(/than|比較級|最高級|more |most /.test(text))return '比較級／最高級';if(/who|which|that|關係代名詞/.test(text))return '關係代名詞';if(/v-ing|to v|動名詞|不定詞|enjoy|decide/.test(text))return '動名詞／不定詞';if(/because|although|however|so that|連接詞/.test(text))return '連接詞';if(/preposition|介系詞|interested in|good at/.test(text))return '介系詞';if(/pronoun|代名詞|refer/.test(text))return '代名詞';if(/since|for|yesterday|already|present perfect|時態/.test(text))return '時態混淆';if(/if |unless|條件句/.test(text))return '條件句';if(/can |must |should |may |助動詞/.test(text))return '助動詞';if(/noun|adjective|adverb|詞性/.test(text))return '詞性判斷';return null}
function enrich(){d.querySelectorAll('.explain.show,.explain').forEach(el=>{if(el.dataset.v8==='1')return;const cat=detect(el.textContent);if(!cat)return;const x=lib[cat];const wrap=d.createElement('div');wrap.className='variant';wrap.innerHTML=`<b>AI 分類診斷｜${cat}</b><div class="diagGrid" style="margin-top:8px"><div class="diagItem"><b>單字</b><p>${x.v}</p></div><div class="diagItem"><b>片語</b><p>${x.p}</p></div><div class="diagItem"><b>文法</b><p>${x.g}</p></div><div class="diagItem"><b>句型</b><p><code>${x.s}</code></p></div><div class="diagItem diagBad"><b>常見錯因</b><p>${x.why}</p></div><div class="diagItem diagGood"><b>判斷線索</b><p>${x.clue}</p></div></div>`;el.appendChild(wrap);el.dataset.v8='1'});}
setInterval(enrich,700);
}
root.addEventListener('load',()=>setTimeout(boot,1400));setTimeout(boot,2500);
})();
</script></body></html>
