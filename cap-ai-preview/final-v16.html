<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜會員與付款 V16</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v15" src="./final-v15.html?v=16"></iframe><script>
(function(){
const root=document.getElementById('v15');
function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<18;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function apiBase(){return location.hostname.includes('raw.githack.com')?'':location.origin}
async function api(path,opts={}){const base=apiBase();if(!base)throw new Error('PREVIEW_ONLY');const r=await fetch(base+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let data={};try{data=await r.json()}catch(e){};if(!r.ok)throw new Error(data.error||'REQUEST_FAILED');return data}
function styles(d){if(d.getElementById('v16style'))return;const s=d.createElement('style');s.id='v16style';s.textContent=`
#accountV16{scroll-margin-top:80px}.memberHero{background:linear-gradient(135deg,#102a4c,#1f5bb5);color:#fff;border-radius:20px;padding:22px;margin:18px 0}.memberHero h2{margin:0 0 7px}.memberHero p{margin:5px 0;color:#dbe6f5}.memberGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.memberCard{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:16px}.memberCard h3{margin:0 0 10px;color:#102a4c}.memberForm{display:grid;gap:9px}.memberForm input,.memberForm select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #ccd8e6;border-radius:10px;font:inherit}.memberForm label{font-size:12px;color:#586678}.memberForm button,.payBtn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primaryV16{background:#102a4c;color:#fff}.secondaryV16{background:#eef3ff;color:#3158ba}.ghostV16{background:#f5f7fb;color:#536178}.statusBox{border:1px solid #dce5ef;background:#f8fafc;border-radius:14px;padding:14px}.statusPill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#eef3ff;color:#3158ba}.statusPill.paid{background:#e8f7ef;color:#176647}.priceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.priceCard{border:1px solid #dce5ef;border-radius:15px;padding:15px;background:#fff}.priceCard.featured{border:2px solid #2762dd;box-shadow:0 8px 24px rgba(39,98,221,.08)}.price{font-size:28px;font-weight:950;color:#102a4c}.saving{display:inline-block;background:#fff3d8;color:#7a5d17;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.paymentNotice{font-size:11px;line-height:1.6;color:#657386;background:#f7f9fc;border-radius:10px;padding:9px 10px;margin-top:10px}.orderBox{margin-top:10px;font-size:12px;line-height:1.7;color:#586678}.hiddenV16{display:none!important}.authTabs{display:flex;gap:7px;margin-bottom:10px}.authTabs button{flex:1}.v16msg{margin-top:8px;font-size:12px;line-height:1.6}.v16msg.error{color:#a33}.v16msg.ok{color:#176647}@media(max-width:760px){.memberGrid,.priceGrid{grid-template-columns:1fr}}
`;d.head.appendChild(s)}
function mount(d){if(d.getElementById('accountV16'))return;const target=d.getElementById('plans')||d.getElementById('dashboard')||d.getElementById('daily')||d.querySelector('main');if(!target)return;const sec=d.createElement('section');sec.id='accountV16';sec.className='section';sec.innerHTML=`
<div class="memberHero"><h2>AI Complete 會員中心</h2><p>正式會員權限由伺服器判斷，不再由瀏覽器自行切換。</p><p>月繳 NT$999｜年繳 NT$9,999（相較月繳一年省 NT$1,989，約 83 折）</p></div>
<div class="memberGrid">
  <div class="memberCard" id="authCardV16">
    <div class="authTabs"><button class="secondaryV16" id="loginTabV16">登入</button><button class="ghostV16" id="signupTabV16">建立帳號</button></div>
    <form id="loginFormV16" class="memberForm"><h3>學生登入</h3><input name="email" type="email" placeholder="學生 Email" required><input name="password" type="password" placeholder="密碼（至少 8 碼）" required><button class="primaryV16">登入</button></form>
    <form id="signupFormV16" class="memberForm hiddenV16"><h3>建立學生帳號</h3><input name="studentName" placeholder="學生真實姓名" required><input name="nickname" placeholder="暱稱（選填）"><input name="email" type="email" placeholder="學生 Email" required><input name="password" type="password" minlength="8" placeholder="密碼（至少 8 碼）" required><input name="school" placeholder="目前就讀國中"><select name="grade"><option value="G9">G9／國三</option><option value="G8">G8／國二</option><option value="G7">G7／國一</option></select><input name="guardianEmail" type="email" placeholder="家長／監護人 Email"><label><input name="guardianConsent" type="checkbox" style="width:auto"> 我已取得家長／監護人同意建立學習帳號</label><button class="primaryV16">建立帳號</button></form><div id="authMsgV16" class="v16msg"></div>
  </div>
  <div class="memberCard"><h3>目前會員狀態</h3><div id="memberStatusV16" class="statusBox">正在讀取會員狀態…</div><button id="logoutV16" class="ghostV16 hiddenV16" style="margin-top:10px">登出</button><div id="orderStatusV16" class="orderBox"></div></div>
</div>
<div class="memberCard" id="upgradeV16" style="margin-top:14px"><h3>升級 AI Complete</h3><div class="priceGrid">
<div class="priceCard"><b>月繳</b><div class="price">NT$999</div><p>AI Complete 30 天</p><form method="POST" action="/api/newebpay/create" class="payFormV16"><input type="hidden" name="plan" value="monthly"><button class="payBtn primaryV16" type="submit">藍新金流付款</button></form></div>
<div class="priceCard featured"><span class="saving">約 83 折｜省 NT$1,989</span><h3 style="margin-top:8px">年繳</h3><div class="price">NT$9,999</div><p>AI Complete 365 天</p><form method="POST" action="/api/newebpay/create" class="payFormV16"><input type="hidden" name="plan" value="annual"><button class="payBtn primaryV16" type="submit">藍新金流付款</button></form></div>
</div><div class="paymentNotice" id="paymentNoticeV16">付款前須先登入。付款成功後，以藍新背景通知與伺服器資料庫為最終依據，會員到期日會自動更新。</div></div>`;
target.parentNode.insertBefore(sec,target);
const nav=d.querySelector('.links');if(nav&&!d.getElementById('accountNavV16')){const a=d.createElement('a');a.id='accountNavV16';a.href='#accountV16';a.textContent='會員／付款';nav.appendChild(a)}
bind(d);refresh(d)}
function setMsg(d,text,type=''){const el=d.getElementById('authMsgV16');if(el){el.textContent=text;el.className='v16msg '+type}}
function bind(d){const loginTab=d.getElementById('loginTabV16'),signupTab=d.getElementById('signupTabV16'),lf=d.getElementById('loginFormV16'),sf=d.getElementById('signupFormV16');loginTab.onclick=()=>{lf.classList.remove('hiddenV16');sf.classList.add('hiddenV16');loginTab.className='secondaryV16';signupTab.className='ghostV16'};signupTab.onclick=()=>{sf.classList.remove('hiddenV16');lf.classList.add('hiddenV16');signupTab.className='secondaryV16';loginTab.className='ghostV16'};
lf.onsubmit=async e=>{e.preventDefault();try{const f=new FormData(lf);await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});setMsg(d,'登入成功。','ok');await refresh(d)}catch(err){setMsg(d,err.message==='PREVIEW_ONLY'?'這個 RawGitHack 頁面是預覽版；正式登入需在 Vercel 網址操作。':'登入失敗：'+err.message,'error')}};
sf.onsubmit=async e=>{e.preventDefault();try{const f=new FormData(sf);await api('/api/auth/signup',{method:'POST',body:JSON.stringify({studentName:f.get('studentName'),nickname:f.get('nickname'),email:f.get('email'),password:f.get('password'),school:f.get('school'),grade:f.get('grade'),guardianEmail:f.get('guardianEmail'),guardianConsent:f.get('guardianConsent')==='on',track:'cap'})});setMsg(d,'帳號已建立並登入。','ok');await refresh(d)}catch(err){setMsg(d,err.message==='PREVIEW_ONLY'?'這個 RawGitHack 頁面是預覽版；正式註冊需在 Vercel 網址操作。':'註冊失敗：'+err.message,'error')}};
d.getElementById('logoutV16').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST',body:'{}'});setMsg(d,'已登出。','ok');await refresh(d)}catch(err){setMsg(d,'登出失敗。','error')}};
d.querySelectorAll('.payFormV16').forEach(form=>form.addEventListener('submit',e=>{if(!apiBase()){e.preventDefault();alert('目前是 RawGitHack 預覽頁。正式付款必須在 Vercel 正式網址操作。');return}if(form.dataset.enabled!=='1'){e.preventDefault();alert('請先登入會員，再進行付款。')}}));}
async function refresh(d){const status=d.getElementById('memberStatusV16'),logout=d.getElementById('logoutV16'),auth=d.getElementById('authCardV16'),notice=d.getElementById('paymentNoticeV16');if(!apiBase()){status.innerHTML='<span class="statusPill">預覽模式</span><p>正式登入、付款與會員資料庫功能需部署到 Vercel 後才能測試。</p>';d.querySelectorAll('.payFormV16').forEach(f=>f.dataset.enabled='0');return}
try{const me=await api('/api/auth/me');if(!me.authenticated){status.innerHTML='<span class="statusPill">尚未登入</span><p>請先登入或建立帳號。</p>';logout.classList.add('hiddenV16');auth.classList.remove('hiddenV16');d.querySelectorAll('.payFormV16').forEach(f=>f.dataset.enabled='0');return}const u=me.user;auth.classList.add('hiddenV16');logout.classList.remove('hiddenV16');const paid=u.membershipPlan==='complete'&&u.membershipStatus==='active';status.innerHTML='<span class="statusPill '+(paid?'paid':'')+'">'+(paid?'AI Complete':'Free')+'</span><p><b>'+esc(u.studentName||u.email)+'</b><br>'+esc(u.email)+'</p>'+(u.expiresAt?'<p>會員到期：<b>'+new Date(u.expiresAt).toLocaleString('zh-TW')+'</b></p>':'');d.querySelectorAll('.payFormV16').forEach(f=>f.dataset.enabled='1');notice.textContent=paid?'目前已是 AI Complete。若再次購買，新的天數會從現有到期日後繼續延長。':'付款成功後，系統會自動升級 AI Complete 並寫入到期日。';await refreshOrder(d)}catch(err){status.innerHTML='<span class="statusPill">系統尚未連線</span><p>'+esc(err.message)+'</p>'}}
async function refreshOrder(d){try{const x=await api('/api/orders/latest');const el=d.getElementById('orderStatusV16');if(!x.order){el.innerHTML='尚無付款訂單。';return}const o=x.order;const labels={pending:'等待付款／確認中',paid:'付款成功',failed:'付款失敗',amount_mismatch:'金額核對異常'};el.innerHTML='<b>最近訂單</b><br>'+esc(o.order_no)+'｜'+esc(labels[o.status]||o.status)+'｜NT$'+Number(o.amount).toLocaleString('zh-TW')}catch(e){}}
function boot(){const d=deepest();if(!d)return;styles(d);mount(d);d.title='2027 會考英文 AI｜會員與付款 V16'}
root.addEventListener('load',()=>{setTimeout(boot,1000);setTimeout(boot,2400)});setInterval(boot,3500)
})();
</script></body></html>
