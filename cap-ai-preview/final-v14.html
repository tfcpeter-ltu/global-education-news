<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V14</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v13" src="./final-v13.html?v=14"></iframe><script>(function(){const root=document.getElementById('v13');function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<16;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}function safe(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function now(){return Date.now()}function fmt(s){const d=new Date(s);return d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})}function skillLabel(s){return({grammar:'文法',vocab:'單字／片語',reading:'閱讀',listening:'聽力'}[s]||s||'弱點')}function normalize(){let sched=safe('cap13ReviewSchedule',[]);let mastery=safe('cap13Mastery',[]);sched=sched.map((x,i)=>({...x,id:x.id||('r'+i+'_'+String(x.reviewAt||'')),status:x.status||'pending',attempts:x.attempts||0}));save('cap13ReviewSchedule',sched);return{sched,mastery}}function stageRank(x){const s=String(x.stage||'');if(s.includes('1–3'))return 1;if(s.includes('7'))return 2;if(s.includes('21'))return 3;return 1}function nextStage(stage){if(stage===1)return{stage:'7 天',days:7};if(stage===2)return{stage:'21–30 天',days:24};return null}function classify(sched){const t=now();return{due:sched.filter(x=>x.status==='pending'&&new Date(x.reviewAt).getTime()<=t),soon:sched.filter(x=>x.status==='pending'&&new Date(x.reviewAt).getTime()>t).sort((a,b)=>new Date(a.reviewAt)-new Date(b.reviewAt)),done1:sched.filter(x=>x.status==='passed'&&stageRank(x)===1),wait7:sched.filter(x=>x.status==='pending'&&stageRank(x)===2),wait21:sched.filter(x=>x.status==='pending'&&stageRank(x)===3),mastered:safe('cap14Mastered',[])}}function qbank(skill){const banks={grammar:{q:'Lena ___ in Taichung since 2023.',o:['lives','lived','has lived','is live'],a:2,e:'since + 時間起點，且狀態延續到現在，使用現在完成式 has/have + p.p.'},vocab:{q:'Can I ___ your dictionary until tomorrow?',o:['lend','borrow','keep','pay'],a:2,e:'問的是「可以保留多久」，用 keep；borrow 是借入的動作。'},reading:{q:'A notice says: “The museum is closed on Mondays.” Kevin plans to visit next Monday. What should he do?',o:['Go as planned','Choose another day','Arrive earlier','Buy two tickets'],a:1,e:'先定位 Monday 與 closed，直接比對即可，不需要額外推論。'},listening:{q:'You hear: “I don’t want tea. I’ll have coffee instead.” What does the speaker choose?',o:['Tea','Coffee','Juice','Water'],a:1,e:'否定 don’t want tea 先排除 tea；instead 後的 coffee 是最後選擇。'}};return banks[skill]||banks.grammar}function injectStyles(d){if(d.getElementById('v14style'))return;const s=d.createElement('style');s.id='v14style';s.textContent='.reviewCenter{margin:16px 0}.reviewStats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.reviewStat{background:#fff;border:1px solid #dce4ee;border-radius:13px;padding:12px}.reviewStat b{display:block;font-size:22px;color:#102a4c}.reviewStat span{font-size:11px;color:#66758b}.reviewCols{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.reviewPanel{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:12px}.reviewPanel h3{margin:0 0 9px;color:#102a4c}.reviewItem{border:1px solid #e4e9f0;border-radius:11px;padding:10px;margin:8px 0;background:#fbfcfe}.reviewTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.reviewTag{font-size:10px;padding:4px 7px;border-radius:999px;background:#eef3ff;color:#3158ba;font-weight:850}.reviewBtn{border:0;border-radius:9px;background:#102a4c;color:#fff;padding:7px 9px;font-weight:850;cursor:pointer}.reviewMini{font-size:11px;color:#66758b;margin-top:5px}.reviewEmpty{padding:15px;text-align:center;color:#8a96a6;font-size:12px}.retestModal{position:fixed;inset:0;background:rgba(5,18,38,.62);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}.retestCard{background:#fff;border-radius:16px;width:min(560px,100%);padding:16px;box-shadow:0 22px 70px rgba(0,0,0,.28)}.retestOpt{display:block;width:100%;text-align:left;margin:7px 0;border:1px solid #dce4ee;background:#fff;border-radius:10px;padding:10px;cursor:pointer}.retestGood{background:#edf8f2;border-color:#83c59f}.retestBad{background:#fff1f1;border-color:#e6a6a6}.masteredBadge{background:#eaf7ef;color:#176647;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}.dueBadge{background:#fff0e4;color:#a65316;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}@media(max-width:760px){.reviewStats{grid-template-columns:repeat(2,1fr)}.reviewCols{grid-template-columns:1fr}}';d.head.appendChild(s)}function retest(d,item){const q=qbank(item.skill);const wrap=d.createElement('div');wrap.className='retestModal';wrap.innerHTML='<div class="retestCard"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>間隔回測｜'+skillLabel(item.skill)+'</b><div class="reviewMini">'+(item.stage||'回測')+'階段</div></div><button id="closeR" style="border:0;background:transparent;font-size:20px">×</button></div><h3>'+q.q+'</h3><div id="ropts">'+q.o.map((o,i)=>'<button class="retestOpt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div id="rfeed" style="display:none;margin-top:10px;background:#f7f9fc;border-radius:10px;padding:10px;font-size:12px;line-height:1.6"></div></div>';d.body.appendChild(wrap);wrap.querySelector('#closeR').onclick=()=>wrap.remove();wrap.querySelectorAll('.retestOpt').forEach(b=>b.onclick=()=>{const pick=Number(b.dataset.i),right=pick===q.a;wrap.querySelectorAll('.retestOpt').forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add('retestGood');else if(i===pick&&!right)x.classList.add('retestBad')});const f=wrap.querySelector('#rfeed');f.style.display='block';f.innerHTML='<b>'+(right?'回測通過':'這個弱點又出現了')+'</b><br>'+q.e+'<br><button class="reviewBtn" id="finishR" style="margin-top:8px">完成</button>';f.querySelector('#finishR').onclick=()=>{finish(item,right);wrap.remove();render(d)}})}function finish(item,right){let sched=safe('cap13ReviewSchedule',[]);const idx=sched.findIndex(x=>(x.id||'')===item.id||(x.reviewAt===item.reviewAt&&x.skill===item.skill&&x.stage===item.stage));if(idx<0)return;const old=sched[idx];old.attempts=(old.attempts||0)+1;old.lastReviewAt=new Date().toISOString();if(right){const r=stageRank(old);old.status='passed';old.passedAt=new Date().toISOString();const ns=nextStage(r);if(ns){sched.push({id:'r'+Date.now(),skill:old.skill,reviewAt:new Date(Date.now()+ns.days*86400000).toISOString(),stage:ns.stage,status:'pending',attempts:0,parentId:old.id})}else{let m=safe('cap14Mastered',[]);if(!m.some(x=>x.skill===old.skill))m.push({skill:old.skill,masteredAt:new Date().toISOString(),source:'V14 spaced review'});save('cap14Mastered',m)}}else{old.status='failed';old.failedAt=new Date().toISOString();sched.push({id:'r'+Date.now(),skill:old.skill,reviewAt:new Date(Date.now()+2*86400000).toISOString(),stage:'1–3 天',status:'pending',attempts:0,restarted:true})}save('cap13ReviewSchedule',sched)}function itemHtml(x,due){return'<div class="reviewItem"><div class="reviewTop"><div><span class="'+(due?'dueBadge':'reviewTag')+'">'+(due?'今日到期':(x.stage||'待複習'))+'</span> <b>'+skillLabel(x.skill)+'</b></div><button class="reviewBtn" data-review="'+x.id+'">開始回測</button></div><div class="reviewMini">'+fmt(x.reviewAt)+'｜'+(x.stage||'間隔複習')+'｜已嘗試 '+(x.attempts||0)+' 次</div></div>'}function render(d){const sec=d.getElementById('spacedReviewCenter');if(!sec)return;const {sched}=normalize(),c=classify(sched);sec.querySelector('#rvDue').textContent=c.due.length;sec.querySelector('#rvSoon').textContent=c.soon.length;sec.querySelector('#rv7').textContent=c.wait7.length;sec.querySelector('#rv21').textContent=c.wait21.length;sec.querySelector('#rvMaster').textContent=c.mastered.length;sec.querySelector('#dueList').innerHTML=c.due.length?c.due.map(x=>itemHtml(x,true)).join(''):'<div class="reviewEmpty">今天沒有到期舊弱點。</div>';sec.querySelector('#soonList').innerHTML=c.soon.slice(0,8).length?c.soon.slice(0,8).map(x=>itemHtml(x,false)).join(''):'<div class="reviewEmpty">目前沒有排程中的複習。</div>';sec.querySelector('#masterList').innerHTML=c.mastered.length?c.mastered.map(x=>'<div class="reviewItem"><span class="masteredBadge">Mastered</span> <b>'+skillLabel(x.skill)+'</b><div class="reviewMini">完成長期驗證：'+fmt(x.masteredAt)+'</div></div>').join(''):'<div class="reviewEmpty">完成 1–3 天、7 天與 21–30 天驗證後，能力才會進入這裡。</div>';sec.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const x=sched.find(v=>v.id===b.dataset.review);if(x)retest(d,x)});updateDash(d,c.due.length)}function updateDash(d,due){const cards=[...d.querySelectorAll('.taskCard,.dashCard,.card')];const target=cards.find(x=>/今日|任務|複習/.test(x.innerText));if(target&&!target.querySelector('.v14DueNote')){const n=d.createElement('div');n.className='v14DueNote';n.style.cssText='margin-top:8px;padding:8px 10px;border-radius:9px;background:#fff8e7;color:#735c19;font-size:11px;font-weight:750';n.textContent='今日到期舊弱點：'+due+' 項';target.appendChild(n)}else if(target&&target.querySelector('.v14DueNote'))target.querySelector('.v14DueNote').textContent='今日到期舊弱點：'+due+' 項'}function addCenter(d){if(d.getElementById('spacedReviewCenter'))return;const anchor=d.getElementById('microHub')||d.getElementById('daily')||d.querySelector('main');if(!anchor)return;const sec=d.createElement('section');sec.id='spacedReviewCenter';sec.className='section reviewCenter';sec.innerHTML='<h2>間隔複習中心</h2><p class="lead">不是答對一次就算學會。舊弱點會在不同時間點重新回來驗證。</p><div class="reviewStats"><div class="reviewStat"><b id="rvDue">0</b><span>今日到期</span></div><div class="reviewStat"><b id="rvSoon">0</b><span>即將到期</span></div><div class="reviewStat"><b id="rv7">0</b><span>等待 7 天</span></div><div class="reviewStat"><b id="rv21">0</b><span>等待 21–30 天</span></div><div class="reviewStat"><b id="rvMaster">0</b><span>Mastered</span></div></div><div class="reviewCols"><div class="reviewPanel"><h3>今天要複習</h3><div id="dueList"></div><h3 style="margin-top:16px">接下來的複習</h3><div id="soonList"></div></div><div class="reviewPanel"><h3>Mastered 已掌握</h3><p class="reviewMini">必須完成多次間隔驗證，不會因單次答對直接進入。</p><div id="masterList"></div></div></div>';anchor.parentNode.insertBefore(sec,anchor);const nav=d.querySelector('.links');if(nav){const a=d.createElement('a');a.href='#spacedReviewCenter';a.textContent='間隔複習';nav.appendChild(a)}}function boot(){const d=deepest();if(!d)return;injectStyles(d);addCenter(d);render(d);d.title='2027 會考英文 AI｜完整產品 V14'}root.addEventListener('load',()=>{setTimeout(boot,1000);setTimeout(boot,2400)});setInterval(boot,4000)})();</script></body></html>
