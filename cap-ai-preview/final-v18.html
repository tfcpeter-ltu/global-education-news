const READ=[['關鍵字／語意線索','看懂單字，卻沒抓到真正證據','錯誤選項常重複文章裡的字，讓你誤以為「有出現就是答案」。','找題幹關鍵詞，再回文章找同義改寫，核對人物、時間、動作與原因。','Mia was tired, so she took a short break before finishing her homework. Why did Mia take a break?',['She finished all her homework.','She felt tired.','She wanted to shop.'],1],['代名詞指涉','it / they / this 到底指誰','最近的名詞不一定就是答案，還要檢查單複數與語意。','把候選名詞代回原句重新讀一次。','Lena put the books on the desk because they were too heavy. What does “they” refer to?',['Lena','the books','the desk'],1],['轉折關係','but / however 後面常是關鍵','只記住前半句，容易錯過作者真正要表達的方向。','看到 but / however / although / yet，先提醒自己「方向要變了」。','The shop looked small outside, but it was very spacious inside. What surprised the writer?',['It was closed.','It was large inside.','It was expensive.'],1],['因果關係','原因與結果容易看反','誘答會把結果寫成原因，或加入文章沒有說的理由。','先把句子整理成「因為 A，所以 B」。','The bus was delayed because of heavy traffic, so Kevin arrived late. Why was Kevin late?',['He missed the bus.','There was heavy traffic.','He woke up late.'],1],['時間順序','before / after / finally 容易混亂','每句都看懂，但事件順序沒有排好。','事件多時在腦中排成 ①②③。','After breakfast, Sam checked his bag and then left for school. What did he do before leaving?',['He checked his bag.','He slept.','He called a teacher.'],0],['主旨判斷','不是挑最有印象的一句','文章真的有寫的細節，很容易被誤選成主旨。','主旨必須能涵蓋大部分段落，而不是只對一句。','An article gives three ways students can save water at home. What is the best title?',['How to Save Water at Home','My Favorite Subject','Why Rain Is Dangerous'],0],['推論／過度推論','合理不代表文章有證據','你可能把自己的常識放進文章。','一定問自己：我可以用哪一句原文證明？','Nora brought an umbrella and wore waterproof shoes. What can we infer?',['She expected rain.','She was swimming.','She lost her coat.'],0],['跨句／跨段整合','答案常不在同一句','某一句看似正確，但可能和前後資訊衝突。','遇到態度改變、原因與推論題，至少往前後多讀一兩句。','Leo once disliked running. Later he ran every morning because he enjoyed training with friends. What changed his attitude?',['School made it easy.','Training with friends made it enjoyable.','He bought shoes.'],1]];
function mountReading(d){if(d.getElementById('readingLabV18'))return;const account=d.getElementById('accountV16')||d.querySelector('main');if(!account)return;const sec=d.createElement('section');sec.id='readingLabV18';sec.innerHTML=`<div class="readingTop"><div class="kicker">AI READING DIAGNOSIS</div><h2>為什麼我每個單字都看懂，題目還是答錯？</h2><p>閱讀理解最常卡在「指涉、轉折、因果、順序、主旨、推論與跨句整合」。AI 要做的是把錯誤拆開，讓學生知道自己到底在哪一步失分。</p></div><div class="readChoices" id="readChoicesV18"></div><div class="readDetail" id="readDetailV18"></div>`;account.insertAdjacentElement('afterend',sec);const choices=sec.querySelector('#readChoicesV18');READ.forEach((x,i)=>{const b=d.createElement('button');b.className='readChoice'+(i===0?' active':'');b.innerHTML=`<b>${x[0]}</b><span>${x[1]}</span>`;b.onclick=()=>renderReading(d,i);choices.appendChild(b)});renderReading(d,0)}
function renderReading(d,i){const x=READ[i],sec=d.getElementById('readingLabV18');if(!sec)return;sec.querySelectorAll('.readChoice').forEach((b,j)=>b.classList.toggle('active',j===i));const p=sec.querySelector('#readDetailV18');p.innerHTML=`<h3 style="margin:0 0 14px;font-size:23px">${x[0]}</h3><div class="diagGrid"><div class="diagBox"><h4>你可能錯在哪裡</h4><p>${x[1]}</p></div><div class="diagBox"><h4>為什麼誘答很像</h4><p>${x[2]}</p></div><div class="diagBox"><h4>正確證據怎麼找</h4><p>${x[3]}</p></div><div class="diagBox"><h4>下次怎麼讀</h4><p>先找證據，再選答案；不要只因為選項「看起來合理」就選。</p></div></div><div class="miniQ"><b>立即同能力變式題</b><p>${x[4]}</p><div>${x[5].map((o,j)=>`<button data-a="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="miniFb" style="font-size:12px;margin-top:8px"></div></div><button class="readSave">存進 AI 重點筆記</button>`;p.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{const a=Number(btn.dataset.a);p.querySelectorAll('[data-a]').forEach(b=>b.classList.remove('good','bad'));btn.classList.add(a===x[6]?'good':'bad');p.querySelector('.miniFb').textContent=a===x[6]?'答對了。你有抓到這一類題目的核心證據。':'這個選項看起來合理，但還沒有被原文證據支持。再回文章找一次。'});p.querySelector('.readSave').onclick=()=>{notesSave({type:'閱讀策略',title:x[0],content:`${x[1]}｜${x[3]}`,createdAt:new Date().toISOString()});p.querySelector('.readSave').textContent='✓ 已存進 AI 重點筆記'}}
function boot(){const d=deepest();if(!d)return;addStyle(d);mountHero(d);mountMethod(d);mountFit(d);mountValue(d);mountCompare(d);updateExistingMembership(d);mountPayPal(d);mountReading(d);d.title='2027 國中教育會考英文 AI｜LTU AI English'}
root.addEventListener('load',()=>{setTimeout(boot,900);setTimeout(boot,2300)});setInterval(boot,5000)
})();
</script></body></html>
