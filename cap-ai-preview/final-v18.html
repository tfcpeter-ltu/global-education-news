<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜付款整合 V18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v17" src="./final-v17.html?v=18-reading-refine"></iframe><script>
(function(){
const root=document.getElementById('v17');
function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<24;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function style(d){if(d.getElementById('v18style'))return;const s=d.createElement('style');s.id='v18style';s.textContent=`
.paypalLiveV18{width:100%;margin-top:8px}.paypalLiveV18 button{width:100%;border:1px solid #0070ba;border-radius:10px;padding:10px 12px;background:#fff;color:#003087;font-weight:900;cursor:pointer}.paypalLiveV18 button:disabled{border-color:#ccd7e4;background:#f4f6f9;color:#7c8794;cursor:not-allowed}.paypalStateV18{font-size:11px;line-height:1.55;color:#657386;margin-top:5px}.paypalOkV18{color:#176647;font-weight:800}.paypalWarnV18{color:#8a650f}.paypalDisabledV17,.methodNoteV17,#systemV17,#systemNavV17{display:none!important}
#readingLabV18{scroll-margin-top:80px;margin:22px 0}.readingHeroV18{background:linear-gradient(135deg,#0e2f56,#174f82);color:#fff;border-radius:20px;padding:22px;box-shadow:0 12px 30px rgba(18,53,89,.12)}.readingHeroV18 .eyebrow{font-size:12px;letter-spacing:.12em;font-weight:900;color:#bfe0ff}.readingHeroV18 h2{margin:6px 0 8px;font-size:24px}.readingHeroV18 p{margin:0;line-height:1.75;color:#e5f1fb}.readingGridV18{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.readTypeV18{border:1px solid #dbe5ef;background:#fff;border-radius:15px;padding:14px;text-align:left;cursor:pointer;transition:.18s;min-height:112px}.readTypeV18:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(21,57,91,.09)}.readTypeV18.active{border:2px solid #2e67d1;background:#f7faff}.readTypeV18 b{display:block;color:#12375c;font-size:14px;margin-bottom:6px}.readTypeV18 span{font-size:11px;color:#6a7988;line-height:1.55}.readPanelV18{margin-top:12px;border:1px solid #dbe5ef;background:#fff;border-radius:17px;padding:18px}.readPanelV18 h3{margin:0 0 12px;color:#12375c}.diagGridV18{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.diagBoxV18{background:#f7f9fc;border:1px solid #e5ebf2;border-radius:13px;padding:13px}.diagBoxV18 h4{margin:0 0 6px;font-size:12px;color:#315c8f}.diagBoxV18 p{margin:0;font-size:12px;line-height:1.7;color:#3f4f5f}.variantV18{margin-top:12px;background:#fff9e8;border:1px solid #f2dfaa;border-radius:13px;padding:14px}.variantV18 .q{font-weight:800;color:#3c3a2a;margin-bottom:8px}.variantV18 button{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid #d8e0ea;background:#fff;border-radius:10px;padding:9px 10px;cursor:pointer}.variantV18 button.good{border-color:#57a77a;background:#eef9f2}.variantV18 button.bad{border-color:#d99;background:#fff2f2}.readActionsV18{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.readActionsV18 button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.saveReadV18{background:#14395f;color:#fff}.nextReadV18{background:#eef3fb;color:#234f85}.readSavedV18{font-size:11px;color:#176647;font-weight:800;margin-left:4px}.readingNoteV18{font-size:11px;color:#6a7988;line-height:1.65;margin-top:10px}@media(max-width:900px){.readingGridV18{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.readingGridV18,.diagGridV18{grid-template-columns:1fr}.readingHeroV18{padding:18px}.readingHeroV18 h2{font-size:21px}}
`;d.head.appendChild(s)}
async function paypalStatus(){try{const r=await fetch('/api/system/paypal-diagnostics',{credentials:'include'});if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function mountPayPal(d){const account=d.getElementById('accountV16');if(!account)return;const cfg=await paypalStatus();const cards=account.querySelectorAll('.priceCard');cards.forEach((card,idx)=>{let form=card.querySelector('.paypalLiveV18');if(!form){form=d.createElement('form');form.className='paypalLiveV18';form.method='POST';form.action='/api/paypal/create';form.innerHTML=`<input type="hidden" name="plan" value="${idx===0?'monthly':'annual'}"><button type="submit">信用卡／PayPal</button><div class="paypalStateV18"></div>`;const nf=card.querySelector('.payFormV16');if(nf)nf.insertAdjacentElement('afterend',form);else card.appendChild(form)}const b=form.querySelector('button'),state=form.querySelector('.paypalStateV18');if(cfg&&cfg.configured){b.disabled=false;state.innerHTML='<span class="paypalOkV18">PayPal 已設定，可進行付款</span>'}else{b.disabled=true;state.innerHTML='<span class="paypalWarnV18">PayPal 尚未完成正式收款設定</span>'}});const notice=d.getElementById('paymentNoticeV16');if(notice)notice.textContent='藍新金流：ATM 轉帳、WebATM、超商代碼、超商條碼。信用卡與海外付款：PayPal。付款成功後，會員期限由伺服器自動更新。';const hash=location.hash;if(hash.includes('paypal-success')){const st=d.getElementById('memberStatusV16');if(st&&!st.querySelector('.paypalOkV18'))st.insertAdjacentHTML('beforeend','<p class="paypalOkV18">PayPal 付款完成，會員狀態正在更新。</p>')}if(hash.includes('paypal-cancelled')&&!window.__ppCancel){window.__ppCancel=1;alert('PayPal 付款已取消，未收款。')}if(hash.includes('paypal-failed')&&!window.__ppFail){window.__ppFail=1;alert('PayPal 付款未完成，請稍後再試。')}}
const READ={
keyword:{name:'關鍵字／語意線索',short:'看懂單字，卻沒抓到真正線索',lost:'你可能看到題目中的同義字，卻沒有回到文章找「支持答案的那一句」。',trap:'錯誤選項常重複文章裡的字，讓人以為「有出現就是答案」。',evidence:'先圈題幹關鍵詞，再找文章中的同義改寫；答案必須同時符合人物、時間、動作或原因。',strategy:'不要找一模一樣的字，找「同一個意思」。看到選項後，再回原文核對一次。',q:'Mia was tired, so she decided to take a short break before finishing her homework. Why did Mia take a break?',opts:['She had finished all her homework.','She felt tired.','She wanted to go shopping.'],ans:1},
reference:{name:'代名詞指涉',short:'it / they / this 到底指誰',lost:'你可能直接用離代名詞最近的名詞作答，但真正指涉要看語意是否合理。',trap:'誘答通常就是代名詞前面最近的名詞。',evidence:'把候選名詞代回原句，檢查單複數、人物／事物與整句意思。',strategy:'「找最近」只能當第一步；第二步一定要把名詞代回去讀。',q:'Lena put the books on the desk because they were too heavy to carry. What does “they” refer to?',opts:['Lena','the books','the desk'],ans:1},
contrast:{name:'轉折關係',short:'but / however / although 後面才是重點',lost:'你可能只記住前半句，沒有注意轉折後作者真正要表達的資訊。',trap:'錯誤選項常直接引用轉折前的內容。',evidence:'看到 but, however, although, yet, instead，先標記；問作者態度或結論時，通常更要看轉折後。',strategy:'轉折詞出現時，在腦中念一句：「方向要變了」。',q:'The restaurant looked small from outside, but the dining room was actually very spacious. What surprised the writer?',opts:['The restaurant was closed.','The dining room was large.','The food was expensive.'],ans:1},
cause:{name:'因果關係',short:'because / so / therefore 誰是原因誰是結果',lost:'你可能知道兩件事有關係，但把原因與結果顛倒。',trap:'誘答會把結果寫成原因，或加入文章沒有說的原因。',evidence:'because 後面通常是原因；so / therefore 後面通常是結果。',strategy:'先在草稿心裡寫成「因為 A，所以 B」，再對照題目到底問 A 還是 B。',q:'The bus was delayed because of heavy traffic, so Kevin arrived late. Why was Kevin late?',opts:['He missed the bus on purpose.','There was heavy traffic.','He woke up late.'],ans:1},
sequence:{name:'時間順序',short:'before / after / when / finally 容易看反',lost:'你可能每句都看懂，但事件先後順序沒有排好。',trap:'誘答會把兩個都出現在文章中的事件對調。',evidence:'抓時間詞與完成式，必要時用 1→2→3 排事件。',strategy:'長篇遇到三個以上事件，邊讀邊在人物旁寫 ①②③。',q:'After Sam finished breakfast, he checked his bag and then left for school. What did Sam do before leaving?',opts:['He checked his bag.','He went to sleep.','He called his teacher.'],ans:0},
main:{name:'主旨判斷',short:'不是挑最有印象的一句',lost:'你可能選了一個文章有提到的細節，但它不能涵蓋整篇。',trap:'誘答通常很具體，而且文章真的有寫，所以特別像答案。',evidence:'主旨要能罩住大部分段落；如果只對一段或一句，通常太窄。',strategy:'讀完問自己：「如果只能用一句話告訴朋友這篇在講什麼？」',q:'A short article explains three ways students can save water at home and why each way helps. What is the best title?',opts:['How to Save Water at Home','My Favorite School Subject','Why Rain Is Dangerous'],ans:0},
inference:{name:'推論／過度推論',short:'答案必須「推得出來」，不能自己加戲',lost:'你可能把自己的常識或想像放進文章，超出作者提供的證據。',trap:'誘答通常「很合理」，但文章沒有足夠證據支持。',evidence:'推論題要能指出至少一個原文線索；找不到線索，就不能選。',strategy:'問自己：「我可以用哪一句原文證明？」不能證明就先刪。',q:'Nora brought an umbrella and wore waterproof shoes before leaving home. What can we infer?',opts:['She expected rainy weather.','She was going swimming.','She had lost her coat.'],ans:0},
integration:{name:'跨句／跨段整合',short:'不能只盯著單一句',lost:'你可能只用題目附近一句判斷，但真正答案需要把前後資訊合起來。',trap:'誘答會符合某一句，卻和另一句衝突。',evidence:'人物目的、態度、改變原因常分散在不同句或不同段。',strategy:'遇到 why / how did X change / what can we know，至少往前後各讀一到兩句。',q:'In paragraph 1, Leo says he dislikes running. In paragraph 3, he says he now runs every morning because he enjoys training with friends. What changed Leo’s attitude?',opts:['Running became easier at school.','Training with friends made it enjoyable.','He bought new shoes.'],ans:1}
};
function noteSave(item){try{const arr=JSON.parse(localStorage.getItem('capAINotes')||'[]');arr.unshift(item);localStorage.setItem('capAINotes',JSON.stringify(arr.slice(0,200)));return true}catch(e){return false}}
function readingSection(d){if(d.getElementById('readingLabV18'))return;const target=d.getElementById('accountV16')||d.getElementById('plans')||d.querySelector('main');if(!target)return;const sec=d.createElement('section');sec.id='readingLabV18';sec.className='section';sec.innerHTML=`<div class="readingHeroV18"><div class="eyebrow">AI READING DIAGNOSIS</div><h2>為什麼這篇文章我看不懂？</h2><p>不是只告訴你答案錯了，而是找出你卡在「字詞、指涉、轉折、因果、順序、主旨、推論，還是跨句整合」。選一個最像你的狀況，立刻看診斷與變式題。</p></div><div class="readingGridV18" id="readingGridV18"></div><div class="readPanelV18" id="readPanelV18"></div><div class="readingNoteV18">診斷練習使用原創題型，用來模擬會考閱讀能力要求，不複製正式試題文字。</div>`;target.parentNode.insertBefore(sec,target);const grid=sec.querySelector('#readingGridV18');Object.entries(READ).forEach(([k,x])=>{const b=d.createElement('button');b.className='readTypeV18';b.dataset.k=k;b.innerHTML=`<b>${x.name}</b><span>${x.short}</span>`;b.onclick=()=>showRead(d,k);grid.appendChild(b)});showRead(d,'keyword');const nav=d.querySelector('.links');if(nav&&!d.getElementById('readingNavV18')){const a=d.createElement('a');a.id='readingNavV18';a.href='#readingLabV18';a.textContent='閱讀診斷';nav.appendChild(a)}}
function showRead(d,k){const x=READ[k],panel=d.getElementById('readPanelV18');if(!x||!panel)return;d.querySelectorAll('.readTypeV18').forEach(b=>b.classList.toggle('active',b.dataset.k===k));panel.innerHTML=`<h3>${x.name}</h3><div class="diagGridV18"><div class="diagBoxV18"><h4>① 你可能在哪一步失分</h4><p>${x.lost}</p></div><div class="diagBoxV18"><h4>② 為什麼錯誤選項很像答案</h4><p>${x.trap}</p></div><div class="diagBoxV18"><h4>③ 正確答案要看什麼證據</h4><p>${x.evidence}</p></div><div class="diagBoxV18"><h4>④ 下一次怎麼讀</h4><p>${x.strategy}</p></div></div><div class="variantV18"><div class="q">立即變式題｜${x.q}</div><div class="opts"></div><div class="result" style="font-size:12px;margin-top:7px;font-weight:800"></div></div><div class="readActionsV18"><button class="saveReadV18">存進 AI 筆記</button><button class="nextReadV18">換一個閱讀弱點</button><span class="readSavedV18"></span></div>`;const opts=panel.querySelector('.opts'),res=panel.querySelector('.result');x.opts.forEach((o,i)=>{const b=d.createElement('button');b.textContent=`${String.fromCharCode(65+i)}. ${o}`;b.onclick=()=>{opts.querySelectorAll('button').forEach((z,j)=>{z.disabled=true;if(j===x.ans)z.classList.add('good');else if(j===i)z.classList.add('bad')});res.textContent=i===x.ans?'答對：你有抓到這一類閱讀線索。':'答錯：先不要急著重看整篇，回到上面的「正確證據」與「下一次怎麼讀」。';res.style.color=i===x.ans?'#176647':'#9b3434'};opts.appendChild(b)});panel.querySelector('.saveReadV18').onclick=()=>{const ok=noteSave({type:'Strategy',category:x.name,title:`閱讀診斷｜${x.name}`,content:`失分點：${x.lost}\n證據：${x.evidence}\n策略：${x.strategy}`,createdAt:new Date().toISOString()});panel.querySelector('.readSavedV18').textContent=ok?'✓ 已存入 AI 筆記':'儲存失敗'};panel.querySelector('.nextReadV18').onclick=()=>{const keys=Object.keys(READ),idx=keys.indexOf(k);showRead(d,keys[(idx+1)%keys.length])}}
async function mount(d){style(d);readingSection(d);await mountPayPal(d);d.title='2027 會考英文 AI｜個人化診斷與會員'}
function boot(){const d=deepest();if(!d)return;mount(d)}
root.addEventListener('load',()=>{setTimeout(boot,900);setTimeout(boot,2400)});setInterval(boot,4500)
})();
</script></body></html>
