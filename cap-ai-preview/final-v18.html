<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜付款整合 V18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v17" src="./final-v17.html?v=18-paypal"></iframe><script>
(function(){
const root=document.getElementById('v17');
function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<24;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}
function style(d){if(d.getElementById('v18style'))return;const s=d.createElement('style');s.id='v18style';s.textContent=`.paypalLiveV18{width:100%;margin-top:8px}.paypalLiveV18 button{width:100%;border:1px solid #0070ba;border-radius:10px;padding:10px 12px;background:#fff;color:#003087;font-weight:900;cursor:pointer}.paypalLiveV18 button:disabled{border-color:#ccd7e4;background:#f4f6f9;color:#7c8794;cursor:not-allowed}.paypalStateV18{font-size:11px;line-height:1.55;color:#657386;margin-top:5px}.paypalOkV18{color:#176647;font-weight:800}.paypalWarnV18{color:#8a650f}.paypalDisabledV17{display:none!important}.methodNoteV17{display:none!important}`;d.head.appendChild(s)}
async function paypalStatus(){try{const r=await fetch('/api/system/paypal-diagnostics',{credentials:'include'});if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function mount(d){const account=d.getElementById('accountV16');if(!account)return;style(d);const cfg=await paypalStatus();const cards=account.querySelectorAll('.priceCard');cards.forEach((card,idx)=>{let form=card.querySelector('.paypalLiveV18');if(!form){form=d.createElement('form');form.className='paypalLiveV18';form.method='POST';form.action='/api/paypal/create';form.innerHTML=`<input type="hidden" name="plan" value="${idx===0?'monthly':'annual'}"><button type="submit">信用卡／PayPal</button><div class="paypalStateV18"></div>`;const nf=card.querySelector('.payFormV16');if(nf)nf.insertAdjacentElement('afterend',form);else card.appendChild(form)}const b=form.querySelector('button'),state=form.querySelector('.paypalStateV18');if(cfg&&cfg.configured){b.disabled=false;state.innerHTML='<span class="paypalOkV18">PayPal 已設定，可進行付款</span>'; }else{b.disabled=true;state.innerHTML='<span class="paypalWarnV18">PayPal 尚未完成 Client ID / Secret 設定</span>';}});const notice=d.getElementById('paymentNoticeV16');if(notice)notice.textContent='藍新金流：ATM 轉帳、WebATM、超商代碼、超商條碼。信用卡與海外付款：PayPal。兩種付款成功後，會員期限都由伺服器自動更新。';const hash=location.hash;if(hash.includes('paypal-success')){const st=d.getElementById('memberStatusV16');if(st)st.insertAdjacentHTML('beforeend','<p class="paypalOkV18">PayPal 付款完成，會員狀態正在更新。</p>')}if(hash.includes('paypal-cancelled'))alert('PayPal 付款已取消，未收款。');if(hash.includes('paypal-failed'))alert('PayPal 付款未完成，請稍後再試。')}
function boot(){const d=deepest();if(!d)return;mount(d);d.title='2027 會考英文 AI｜付款整合 V18'}
root.addEventListener('load',()=>{setTimeout(boot,1000);setTimeout(boot,2600)});setInterval(boot,4500)
})();
</script></body></html>
