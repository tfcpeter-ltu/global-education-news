<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V9</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v8" src="./final-v8.html?v=9"></iframe><script>(function(){const root=document.getElementById('v8');function deepestDoc(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<10;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}const groups=[{k:'look see watch',title:'look / see / watch',rows:[['look','看、注視','常接 at','Look at the board.'],['see','看見、看到結果','強調看見','I saw him yesterday.'],['watch','觀看一段時間','電視、比賽、活動','We watched the game.']],tip:'先判斷是「看向某物」、單純「看見」，還是「持續觀看」。'},{k:'say tell speak talk',title:'say / tell / speak / talk',rows:[['say','說出內容','say + 內容','She said hello.'],['tell','告訴某人','tell + 人 + 內容','Tell me the truth.'],['speak','說某語言／較正式交談','speak English','He speaks English.'],['talk','交談','talk to/with + 人','I talked with Amy.']],tip:'看到受詞是「人」時，先想 tell；看到語言時，先想 speak。'},{k:'borrow lend keep',title:'borrow / lend / keep',rows:[['borrow','借入','borrow A from B','I borrowed a book from Tom.'],['lend','借出','lend A to B','Tom lent a book to me.'],['keep','保留、借多久','keep + 物 + 時間','You may keep it for a week.']],tip:'borrow 是借進來，lend 是借出去，keep 常回答「可以借多久」。'},{k:'spend cost take pay',title:'spend / cost / take / pay',rows:[['spend','人花時間/錢','spend 時間/錢 on N / V-ing','I spent two hours studying.'],['cost','物花費多少錢','物 + cost + 人 + 錢','The bag cost me $30.'],['take','做某事花時間','It takes + 人 + 時間 + to V','It took me an hour to finish.'],['pay','人付錢','pay + 錢 + for + 物','I paid $20 for the book.']],tip:'先看主詞是「人」還是「物」，再判斷是時間還是金錢。'},{k:'another other the other others',title:'another / other / the other / others',rows:[['another','另一個','another + 單數名詞','Can I have another cup?'],['other','其他的','other + 複數名詞','Other students agreed.'],['the other','兩者中的另一個','the other + 單數名詞','One is red; the other is blue.'],['others','其他人/物','單獨使用，不接名詞','Some stayed; others left.']],tip:'兩個東西中的「另一個」用 the other；不接名詞時常用 others。'},{k:'few a few little a little',title:'few / a few / little / a little',rows:[['few','幾乎沒有','可數複數，偏否定','Few students came.'],['a few','有一些','可數複數，偏肯定','A few students came.'],['little','幾乎沒有','不可數，偏否定','There is little water.'],['a little','有一些','不可數，偏肯定','There is a little water.']],tip:'先判斷名詞可數不可數，再看語意是「幾乎沒有」還是「有一些」。'},{k:'too either also',title:'too / either / also',rows:[['too','也','肯定句句尾','I like it, too.'],['either','也不','否定句句尾','I do not like it, either.'],['also','也','通常放在 be 後、一般動詞前','She is also a teacher.']],tip:'否定句的「也」先想到 either。'},{k:'because because of',title:'because / because of',rows:[['because','因為','後接子句 S + V','We stayed home because it rained.'],['because of','因為','後接名詞/名詞片語','We stayed home because of the rain.']],tip:'看後面是不是完整主詞＋動詞。'},{k:'although but',title:'although / but',rows:[['although','雖然','引導讓步子句','Although it was late, we stayed.'],['but','但是','連接兩個對等部分','It was late, but we stayed.']],tip:'同一句通常不要同時使用 although 和 but。'},{k:'during for while',title:'during / for / while',rows:[['during','在…期間','後接名詞','during the summer'],['for','長達','後接一段時間','for three days'],['while','當…時','後接子句 S + V','while I was studying']],tip:'while 後面要能看到主詞＋動詞；during 後面通常是名詞。'},{k:'since for',title:'since / for',rows:[['since','自從','後接時間起點','since 2024 / since Monday'],['for','長達','後接一段時間','for two years / for a week']],tip:'起點用 since；長度用 for。'},{k:'so such',title:'so / such',rows:[['so','如此','so + 形容詞/副詞','so beautiful'],['such','如此','such + (a/an) + 形容詞 + 名詞','such a beautiful day']],tip:'有名詞通常先想 such；只有形容詞/副詞通常先想 so。'},{k:'make let have',title:'make / let / have',rows:[['make','使某人做','make + 人 + 原形動詞','The teacher made us stay.'],['let','讓某人做','let + 人 + 原形動詞','My mom let me go.'],['have','請/讓某人做','have + 人 + 原形動詞','I had him check it.']],tip:'這三個使役動詞後面常接「人＋原形動詞」。'},{k:'stop to stop ing',title:'stop to V / stop V-ing',rows:[['stop to V','停下原本的事，去做另一件事','stop to drink','He stopped to drink water.'],['stop V-ing','停止正在做的事','stop talking','Please stop talking.']],tip:'to V 是「停下來去做」；V-ing 是「停止這件事」。'},{k:'remember to remember ing',title:'remember to V / remember V-ing',rows:[['remember to V','記得要去做','未來/尚未完成','Remember to lock the door.'],['remember V-ing','記得曾經做過','過去經驗','I remember meeting him.']],tip:'to V 看向未完成的任務；V-ing 回想已發生的事情。'}];function addStyles(d){if(d.getElementById('v9styles'))return;const st=d.createElement('style');st.id='v9styles';st.textContent='.confusionBox{margin-top:12px;border:1px solid #d9e3f0;border-radius:14px;overflow:hidden;background:#fff}.confusionHead{background:#102a4c;color:#fff;padding:10px 12px;font-weight:900}.confusionTip{padding:9px 12px;background:#fff8e7;color:#6e5617;font-size:12px;line-height:1.6}.confusionTable{width:100%;border-collapse:collapse;font-size:12px}.confusionTable th,.confusionTable td{padding:8px;border-top:1px solid #edf1f5;text-align:left;vertical-align:top}.confusionTable th{background:#f7f9fc;color:#536178}.confusionBtns{display:flex;gap:7px;flex-wrap:wrap;padding:10px 12px;background:#fbfcfe}.confusionBtns button{border:1px solid #d8e1ec;background:#fff;border-radius:9px;padding:7px 9px;font-weight:800;color:#3158ba;cursor:pointer}.confusionLibrary{margin:14px 0;display:grid;gap:10px}.confusionSearch{width:100%;padding:10px 12px;border:1px solid #d8e1ec;border-radius:10px}@media(max-width:650px){.confusionTable{font-size:11px}.confusionTable th:nth-child(4),.confusionTable td:nth-child(4){display:none}}';d.head.appendChild(st)}function notePush(type,title,content){try{const key='capAINotes';let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};arr.push({type,title,content,createdAt:new Date().toISOString(),source:'V9 易混淆比較'});localStorage.setItem(key,JSON.stringify(arr));alert('已收進 AI 筆記：'+title)}catch(e){alert('筆記儲存失敗')}}function renderGroup(g){const rows=g.rows.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>').join('');return '<div class="confusionBox"><div class="confusionHead">易混淆比較｜'+esc(g.title)+'</div><table class="confusionTable"><thead><tr><th>字詞</th><th>核心差別</th><th>用法</th><th>例句</th></tr></thead><tbody>'+rows+'</tbody></table><div class="confusionTip"><b>判斷口訣：</b>'+esc(g.tip)+'</div><div class="confusionBtns"><button data-note="'+esc(g.title)+'">收進 AI 筆記</button></div></div>'}function detect(text){const t=String(text||'').toLowerCase();let best=null,score=0;groups.forEach(g=>{let s=0;g.k.split(' ').forEach(w=>{if(t.includes(w))s++});if(s>score){score=s;best=g}});return score>=1?best:null}function enhanceWrongCards(d){const nodes=[...d.querySelectorAll('.explain,.wrongItem,.diagnosisCard,.aiDiagnosis,.report,.modal .mbody')];nodes.forEach(n=>{if(n.dataset.v9done)return;const g=detect(n.innerText);if(!g)return;n.dataset.v9done='1';n.insertAdjacentHTML('beforeend',renderGroup(g));n.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>notePush('Vocabulary / Phrase',g.title,g.rows.map(r=>r.join('｜')).join('\n')+'\n判斷口訣：'+g.tip))})}function addLibrary(d){if(d.getElementById('confusionLibraryBtn'))return;const target=d.getElementById('daily')||d.querySelector('main');if(!target)return;const sec=d.createElement('section');sec.className='section';sec.id='confusionLibrary';sec.innerHTML='<h2>易混淆單字／片語診斷庫</h2><p class="lead">會考常見失分不一定是單字不會，有時是幾個看起來很像的字用法混在一起。輸入關鍵字即可快速比較。</p><input id="confusionSearch" class="confusionSearch" placeholder="例如：borrow、because、since、stop"><div id="confusionResults" class="confusionLibrary">'+groups.slice(0,4).map(renderGroup).join('')+'</div>';target.parentNode.insertBefore(sec,target);const inp=sec.querySelector('#confusionSearch'),res=sec.querySelector('#confusionResults');function bind(){res.querySelectorAll('[data-note]').forEach(btn=>{const g=groups.find(x=>x.title===btn.dataset.note);if(g)btn.onclick=()=>notePush('Vocabulary / Phrase',g.title,g.rows.map(r=>r.join('｜')).join('\n')+'\n判斷口訣：'+g.tip)})}bind();inp.oninput=()=>{const q=inp.value.trim().toLowerCase();const list=!q?groups.slice(0,4):groups.filter(g=>g.title.toLowerCase().includes(q)||g.k.includes(q)||g.rows.some(r=>r.join(' ').toLowerCase().includes(q)));res.innerHTML=(list.length?list:groups.slice(0,4)).map(renderGroup).join('');bind()};const nav=d.querySelector('.links');if(nav){const a=d.createElement('a');a.id='confusionLibraryBtn';a.href='#confusionLibrary';a.textContent='易混淆字';nav.appendChild(a)}}function boot(){const d=deepestDoc();if(!d)return;addStyles(d);addLibrary(d);enhanceWrongCards(d);if(!d.defaultView.__v9observer){d.defaultView.__v9observer=true;new MutationObserver(()=>enhanceWrongCards(d)).observe(d.body,{childList:true,subtree:true})}d.title='2027 會考英文 AI｜完整產品 V9'}root.addEventListener('load',()=>{setTimeout(boot,900);setTimeout(boot,2200)});setInterval(boot,3000)})();</script></body></html>
