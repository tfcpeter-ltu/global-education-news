<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v6" src="./final-v6.html?v=7"></iframe><script>
(function(){
const root=document.getElementById('v6');
function deepestDoc(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<8;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}
function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function notes(){try{return JSON.parse(localStorage.getItem('capV7DiagnosticNotes')||'[]')}catch(e){return[]}}
function saveNote(n){const a=notes();if(!a.some(x=>x.key===n.key)){a.unshift(n);localStorage.setItem('capV7DiagnosticNotes',JSON.stringify(a.slice(0,200)))}renderNotebook()}
function profile(){try{return JSON.parse(localStorage.getItem('cap12Profile')||'{}')}catch(e){return{}}}
const DATA={
 presentPerfect:{title:'現在完成式',vocab:[['since','自從；後接起點'],['for','長達；後接一段時間'],['already','已經'],['yet','尚未／已經（疑問、否定）']],phrases:['have/has + p.p.','since + 起點','for + 一段時間'],grammar:'現在完成式表示「過去開始，到現在仍有關聯」的動作或經驗。看到 since、for、already、yet、ever、never 時，要先檢查 have/has + 過去分詞。',pattern:'S + have/has + p.p. + since/for ...',trap:'常見錯誤是只看到過去時間概念就選過去式，忽略句子仍連到現在。',clue:'先找時間線索，再看主詞是單數還是複數，最後確認動詞是否為 p.p.'},
 askTo:{title:'受詞＋不定詞',vocab:[['ask','請求；要求'],['tell','告訴；吩咐'],['want','希望；想要']],phrases:['ask + 人 + to V','tell + 人 + to V','want + 人 + to V'],grammar:'ask、tell、want 這類動詞後面若接「人＋動作」，常用受詞＋to V。',pattern:'S + ask/tell/want + O + to + V',trap:'常見錯誤是把 to 後面接成 V-ing，或漏掉 to。',clue:'看到 ask/tell/want 後面先找「人」，若後面還有另一個動作，優先檢查 to V。'},
 reference:{title:'代名詞指涉',vocab:[['it','它／此事'],['they','他們／它們'],['this','這件事／這個概念']],phrases:['refer to','stand for'],grammar:'指涉題不是只看前一個名詞，而是要找「語意與單複數都能接得上」的先行詞。',pattern:'pronoun → nearest logical antecedent',trap:'常被離代名詞最近、但語意不合理的名詞吸引。',clue:'先看單複數，再把代名詞換回候選名詞，整句讀一次。'},
 mainIdea:{title:'主旨判斷',vocab:[['main idea','主旨'],['purpose','目的'],['mainly','主要地']],phrases:['be mainly about','the purpose of'],grammar:'主旨題要找能涵蓋整篇的答案，不是只對其中一句。',pattern:'主題 + 作者主要觀點／目的',trap:'干擾選項常是文章中的真細節，但範圍太小。',clue:'先看首段與末段，再檢查選項能不能涵蓋中間主要內容。'},
 inference:{title:'推論',vocab:[['infer','推論'],['probably','很可能'],['suggest','暗示']],phrases:['we can infer that','it is likely that'],grammar:'推論必須建立在文章已提供的線索上，不能加入自己的常識故事。',pattern:'text clue + reasonable conclusion',trap:'最常見錯誤是選到「聽起來合理」但文中沒有證據的答案。',clue:'要求自己指出支持答案的原句或兩個線索；找不到就先不要選。'},
 detail:{title:'細節理解',vocab:[['according to','根據'],['mention','提到'],['detail','細節']],phrases:['according to the passage','which is true'],grammar:'細節題的關鍵是定位，不需要先解釋全文。',pattern:'題目關鍵字 → 文中同義詞／改寫 → 核對選項',trap:'干擾項常把文中的人、時間、地點或原因交換。',clue:'圈題目關鍵字，回文定位，再逐字核對 who/when/where/why。'},
 listening:{title:'聽力理解',vocab:[['actually','其實'],['instead','反而／改為'],['probably','很可能'],['suggest','建議／暗示']],phrases:['Why don’t we ...?','How about ...?','Would you like to ...?'],grammar:'聽力題常把答案放在轉折、否定、建議或最後一句。',pattern:'情境 → 關鍵轉折／回應 → 最符合的選項',trap:'只抓到單一關鍵字，卻沒有聽完整句意。',clue:'第一遍抓人物與情境；第二遍專聽 but、actually、instead、so、because 後面的資訊。'},
 vocabulary:{title:'字彙語境',vocab:[['context','上下文'],['meaning','意思'],['fit','符合／適合']],phrases:['based on the context','fit the sentence'],grammar:'字彙題不是只考中文翻譯，而是考詞義、詞性與上下文搭配。',pattern:'句意 + 詞性 + 搭配 → 最合適單字',trap:'選到中文意思接近，但詞性或常見搭配不對的字。',clue:'先判斷空格需要名詞／動詞／形容詞／副詞，再看前後搭配。'},
 cloze:{title:'克漏／篇章連貫',vocab:[['however','然而'],['therefore','因此'],['although','雖然'],['because','因為']],phrases:['as a result','for example','on the other hand'],grammar:'克漏題常同時考文法與上下文邏輯。',pattern:'前句關係 + 後句關係 + 文法位置',trap:'只看單句文法正確，卻忽略上下句邏輯。',clue:'先判斷前後是因果、轉折、舉例還是順承，再選連接語。'}
};
function classify(text,tags){const s=(text+' '+tags).toLowerCase();if(/since|for |already|yet|have |has /.test(s))return DATA.presentPerfect;if(/ask|tell|want/.test(s)&&/ to |to v/.test(s))return DATA.askTo;if(/refer|reference|pronoun|指涉/.test(s))return DATA.reference;if(/main idea|mainly|purpose|主旨/.test(s))return DATA.mainIdea;if(/infer|probably|推論|imply|suggest/.test(s))return DATA.inference;if(/listening|聽力|audio|播放/.test(s))return DATA.listening;if(/cloze|however|therefore|although|because|克漏|篇章/.test(s))return DATA.cloze;if(/according|detail|細節|which is true/.test(s))return DATA.detail;return DATA.vocabulary}
function enhance(ex){if(!ex||ex.dataset.v7==='1')return;const card=ex.closest('.panel,.card,.examQ')||ex.parentElement;const bad=card&&card.querySelector('.opt.bad');if(!bad)return;const good=card.querySelector('.opt.good');const q=(card.querySelector('.question')||{}).textContent||'';const tags=[...card.querySelectorAll('.qtag,.badge')].map(x=>x.textContent).join(' ');const d=classify(q,tags);const original=ex.innerHTML;const chosen=bad.textContent.trim();const correct=good?good.textContent.trim():'正確選項';const key=(q+'|'+chosen).slice(0,180);
const vocab=d.vocab.map(x=>'<span class="v7pill"><b>'+esc(x[0])+'</b> '+esc(x[1])+'</span>').join('');const phrase=d.phrases.map(x=>'<span class="v7pill phrase">'+esc(x)+'</span>').join('');
ex.dataset.v7='1';ex.innerHTML='<div class="v7diag"><div class="v7title">AI 錯題診斷｜'+esc(d.title)+'</div><div class="v7hero"><b>你選了：</b>'+esc(chosen)+'<br><b>正確答案：</b>'+esc(correct)+'<p><b>你可能錯在：</b>'+esc(d.trap)+'</p></div><div class="v7grid"><section><h4>① 單字 Vocabulary</h4><div class="v7pills">'+vocab+'</div></section><section><h4>② 片語 Phrase / Collocation</h4><div class="v7pills">'+phrase+'</div></section><section><h4>③ 文法 Grammar</h4><p>'+esc(d.grammar)+'</p></section><section><h4>④ 句型 Sentence Pattern</h4><div class="v7pattern">'+esc(d.pattern)+'</div></section><section><h4>⑤ 為什麼這個選項不對</h4><p>你選的「'+esc(chosen)+'」在這一題看起來有吸引力，但沒有同時符合本題需要的<strong>語意、文法／句型與上下文線索</strong>。'+esc(d.trap)+'</p></section><section><h4>⑥ 正確判斷線索</h4><p>'+esc(d.clue)+'</p></section></div><details class="v7original"><summary>看原本逐題解析</summary>'+original+'</details><div class="v7actions"><button class="btn primary v7save">收進 AI 筆記</button><button class="btn secondary v7again">立即做同能力變式題</button></div></div>';
const save=ex.querySelector('.v7save');if(save)save.onclick=()=>{saveNote({key,date:new Date().toISOString(),skill:d.title,question:q,chosen,correct,vocab:d.vocab,phrases:d.phrases,grammar:d.grammar,pattern:d.pattern,clue:d.clue});save.textContent='✓ 已收進 AI 筆記';save.disabled=true};const ag=ex.querySelector('.v7again');if(ag)ag.onclick=()=>{const v=card.querySelector('.variant');if(v){v.scrollIntoView({behavior:'smooth',block:'center'});v.style.outline='2px solid #2762dd'}else{const btn=[...card.querySelectorAll('button')].find(b=>/變式|再練|下一題/.test(b.textContent));if(btn)btn.click();}}}
function renderNotebook(){const d=deepestDoc();if(!d)return;let box=d.getElementById('v7Notebook');if(!box)return;const a=notes();const cats=['全部','單字','片語','文法','句型','策略'];box.innerHTML='<div class="v7tabs">'+cats.map((c,i)=>'<button class="v7tab '+(i?'':'on')+'" data-c="'+c+'">'+c+'</button>').join('')+'</div><div id="v7NoteList"></div>';box.querySelectorAll('.v7tab').forEach(b=>b.onclick=()=>{box.querySelectorAll('.v7tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw(b.dataset.c)});function draw(c){const list=box.querySelector('#v7NoteList');if(!a.length){list.innerHTML='<p class="v7empty">完成錯題解析後，按「收進 AI 筆記」，內容會依類別整理在這裡。</p>';return}list.innerHTML=a.map((n,i)=>{let body='';if(c==='單字')body=n.vocab.map(x=>'<span class="v7pill"><b>'+esc(x[0])+'</b> '+esc(x[1])+'</span>').join('');else if(c==='片語')body=n.phrases.map(x=>'<span class="v7pill phrase">'+esc(x)+'</span>').join('');else if(c==='文法')body='<p>'+esc(n.grammar)+'</p>';else if(c==='句型')body='<div class="v7pattern">'+esc(n.pattern)+'</div>';else if(c==='策略')body='<p>'+esc(n.clue)+'</p>';else body='<p><b>題目：</b>'+esc(n.question)+'</p><p><b>錯因：</b>'+esc(n.chosen)+' → '+esc(n.correct)+'</p><div class="v7pattern">'+esc(n.pattern)+'</div>';return '<article class="v7note"><div><span class="badge">'+esc(n.skill)+'</span><small>'+new Date(n.date).toLocaleDateString('zh-TW')+'</small></div>'+body+'</article>'}).join('') }draw('全部')}
function install(){const d=deepestDoc();if(!d||d.documentElement.dataset.v7installed)return false;d.documentElement.dataset.v7installed='1';d.title='2027 會考英文 AI｜完整產品 V7';const css=d.createElement('style');css.textContent='.v7diag{margin-top:8px}.v7title{font-size:16px;font-weight:950;color:#102a4c;margin-bottom:10px}.v7hero{background:#fff4f2;border:1px solid #efc1ba;border-radius:12px;padding:12px;line-height:1.65}.v7hero p{margin:8px 0 0}.v7grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.v7grid section{background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:11px}.v7grid h4{margin:0 0 7px;color:#102a4c;font-size:12px}.v7grid p{margin:0;font-size:12px;line-height:1.7;color:#536178}.v7pills{display:flex;gap:5px;flex-wrap:wrap}.v7pill{background:#eef3ff;color:#3158ba;border-radius:999px;padding:5px 8px;font-size:10px}.v7pill.phrase{background:#fff6df;color:#795a00}.v7pattern{background:#f4f7fb;border-left:4px solid #2762dd;border-radius:7px;padding:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#193454}.v7original{margin-top:9px;font-size:12px;color:#536178}.v7original summary{cursor:pointer;font-weight:850;color:#3158ba}.v7actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.v7notebookWrap{background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:16px;margin:14px 0}.v7notebookWrap h3{margin:0 0 5px;color:#102a4c}.v7notebookWrap>p{font-size:12px;color:#66758b}.v7tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.v7tab{border:1px solid #dfe6ef;background:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800}.v7tab.on{background:#102a4c;color:#fff}.v7note{border-top:1px solid #edf1f6;padding:11px 0}.v7note:first-child{border-top:0}.v7note small{margin-left:7px;color:#8a95a5}.v7note p{font-size:12px;line-height:1.65;color:#536178}.v7empty{font-size:12px;color:#78869a}@media(max-width:650px){.v7grid{grid-template-columns:1fr}}';d.head.appendChild(css);
const center=[...d.querySelectorAll('section,.section')].find(x=>/我的學習中心/.test(x.textContent||''));if(center&&!d.getElementById('v7Notebook'))center.insertAdjacentHTML('beforeend','<div class="v7notebookWrap"><h3>AI 錯題解析筆記</h3><p>從你實際答錯的題目，自動整理單字、片語、文法、句型與判斷策略。</p><div id="v7Notebook"></div></div>');
d.addEventListener('click',()=>setTimeout(()=>d.querySelectorAll('.explain.show').forEach(enhance),50),true);new MutationObserver(()=>d.querySelectorAll('.explain.show').forEach(enhance)).observe(d.body,{subtree:true,attributes:true,childList:true,attributeFilter:['class']});renderNotebook();return true}
let tries=0;const t=setInterval(()=>{tries++;if(install()||tries>60)clearInterval(t)},300);root.addEventListener('load',()=>{tries=0});
})();
</script></body></html>
