<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V6</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v5" src="./final-v5.html?v=6"></iframe><script>
(function(){
const root=document.getElementById('v5');
function safeJSON(v,d){try{return JSON.parse(v)||d}catch(e){return d}}
function actualDoc(){try{const d5=root.contentDocument;if(!d5)return null;const f4=d5.getElementById('outer');if(!f4||!f4.contentDocument)return null;const d4=f4.contentDocument;const f3=d4.getElementById('app');if(!f3||!f3.contentDocument)return null;return f3.contentDocument}catch(e){return null}}
function profile(){const keys=['cap12Profile','cap15Profile','capAIProfile','capProfile'];for(const k of keys){const p=safeJSON(localStorage.getItem(k),null);if(p&&typeof p==='object')return p}return {}}
function activities(){return safeJSON(localStorage.getItem('capV6Activity'),[])}
function saveAct(type,meta){const a=activities();a.push({at:new Date().toISOString(),type,meta:meta||{}});localStorage.setItem('capV6Activity',JSON.stringify(a.slice(-300)));renderDash()}
function dayKey(d){return new Date(d).toISOString().slice(0,10)}
function streak(){const days=[...new Set(activities().map(x=>dayKey(x.at)))].sort().reverse();if(!days.length)return 0;let n=0,cur=new Date();cur.setHours(0,0,0,0);for(let i=0;i<370;i++){const k=cur.toISOString().slice(0,10);if(days.includes(k)){n++;cur.setDate(cur.getDate()-1)}else if(i===0){cur.setDate(cur.getDate()-1)}else break}return n}
function weekActs(){const now=Date.now(),cut=now-7*86400000;return activities().filter(x=>new Date(x.at).getTime()>=cut)}
function historyPool(){let all=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!/history|wrong|mock|answer|log/i.test(k))continue;const v=safeJSON(localStorage.getItem(k),null);if(Array.isArray(v))all=all.concat(v)}return all}
function weakSkill(){const h=historyPool();const c={};h.forEach(x=>{if(!x||typeof x!=='object')return;const bad=x.correct===false||x.isCorrect===false||x.wrong===true||x.result==='wrong';const s=x.skill||x.competency||x.type;if(bad&&s)c[s]=(c[s]||0)+1});const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:'等待更多作答資料'}
function latestMock(){const h=historyPool().filter(x=>x&&typeof x==='object'&&(/mock/i.test(x.type||'')||x.mockScore!=null||x.readingScore!=null));if(!h.length)return '尚無紀錄';const x=h[h.length-1];if(x.percent!=null)return x.percent+'%';if(x.score!=null)return x.score+'%';if(x.mockScore!=null)return x.mockScore+'%';return '已有紀錄'}
function todayProgress(){const t=dayKey(new Date());const a=activities().filter(x=>dayKey(x.at)===t);return {practice:a.some(x=>x.type==='daily'),wrong:a.some(x=>x.type==='wrong-review'),mock:a.some(x=>x.type==='mock'),count:a.length}}
function inject(){const d=actualDoc();if(!d||d.getElementById('v6Dashboard'))return false;const css=d.createElement('style');css.textContent=`.v6dash{margin:18px 0 8px;background:linear-gradient(135deg,#102a4c,#164f7a);color:#fff;border-radius:22px;padding:20px}.v6dash h2{color:#fff;margin:0 0 5px}.v6sub{color:#d4e1ee;font-size:13px;line-height:1.6}.v6stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.v6stat{background:#ffffff14;border:1px solid #ffffff17;border-radius:14px;padding:12px}.v6stat small{display:block;color:#cbd9e6;font-size:10px}.v6stat b{display:block;font-size:20px;margin-top:3px}.v6tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.v6task{background:#fff;color:#172033;border-radius:14px;padding:13px}.v6task b{color:#102a4c}.v6task p{color:#66758b;font-size:11px;min-height:34px}.v6task .state{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef3ff;color:#3158ba}.v6actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.v6btn{border:0;border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer}.v6btn.white{background:#fff;color:#102a4c}.v6btn.ghost{background:#ffffff18;color:#fff;border:1px solid #ffffff34}.v6week{margin:16px 0;background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:16px}.v6weekgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.v6w{border:1px solid #e3e8ef;border-radius:12px;padding:11px}.v6w small{display:block;color:#6c788a;font-size:10px}.v6w b{font-size:18px;color:#102a4c}.v6modal{position:fixed;inset:0;background:#06111f99;z-index:999;display:none;overflow:auto;padding:24px}.v6modal.show{display:block}.v6report{max-width:820px;margin:auto;background:#fff;border-radius:20px;padding:22px}.v6report h2{margin-top:0}.v6reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v6r{border:1px solid #dfe6ef;border-radius:12px;padding:12px}.v6r small{display:block;color:#66758b}.v6r b{font-size:18px}.v6line{border-top:1px solid #e4e9f0;margin:14px 0}.v6reportActions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:760px){.v6stats{grid-template-columns:1fr 1fr}.v6tasks,.v6weekgrid,.v6reportgrid{grid-template-columns:1fr}}@media print{body>*{display:none!important}.v6modal.show{display:block!important;position:static;background:#fff;padding:0}.v6report{box-shadow:none;max-width:none}.v6reportActions{display:none}}`;d.head.appendChild(css);
const daily=d.getElementById('daily')||d.querySelector('.practice')?.closest('section');const sec=d.createElement('section');sec.id='v6Dashboard';sec.className='section';sec.innerHTML=`<div class="v6dash"><div><span style="font-size:11px;color:#cfe0ee;font-weight:800">MY LEARNING DASHBOARD</span><h2 id="v6Hello">我的今日學習</h2><div class="v6sub">每天先完成個人任務，再利用錯題與 Weekly Mock 驗證弱點是否改善。</div></div><div class="v6stats"><div class="v6stat"><small>今日任務</small><b id="v6Today">0 / 3</b></div><div class="v6stat"><small>連續學習</small><b id="v6Streak">0 天</b></div><div class="v6stat"><small>近 7 日活動</small><b id="v6WeekCount">0</b></div><div class="v6stat"><small>首要弱點</small><b id="v6Weak" style="font-size:14px">—</b></div><div class="v6stat"><small>最近模考</small><b id="v6Mock" style="font-size:14px">—</b></div></div><div class="v6tasks"><div class="v6task"><span class="state" id="stateDaily">尚未完成</span><b style="display:block;margin-top:8px">① 今日個人化練習</b><p>Free 每日 5 題；Complete 每日 10 題，依目前弱點調整比例。</p><button class="btn primary" id="v6GoDaily">開始今日練習</button></div><div class="v6task"><span class="state" id="stateWrong">尚未完成</span><b style="display:block;margin-top:8px">② 錯題再驗證</b><p>重新挑戰最近失分能力，同能力但不同情境，不重複背答案。</p><button class="btn secondary" id="v6GoWrong">查看我的錯題</button></div><div class="v6task"><span class="state" id="stateMock">本週待完成</span><b style="display:block;margin-top:8px">③ Weekly Mock</b><p>完整會員每週閱讀 43 題＋聽力 21 題，完成後回寫下一輪弱點。</p><button class="btn secondary" id="v6GoMock">進入本週模考</button></div></div><div class="v6actions"><button class="v6btn white" id="v6Parent">家長學習報告</button><button class="v6btn ghost" id="v6Center">完整學習歷程</button></div></div><div class="v6week"><h3 style="margin:0 0 4px;color:#102a4c">本週學習摘要</h3><div style="font-size:12px;color:#66758b;margin-bottom:10px">以最近 7 天的實際操作紀錄整理，不預填假成績。</div><div class="v6weekgrid"><div class="v6w"><small>學習活動</small><b id="sumActs">0</b></div><div class="v6w"><small>每日練習</small><b id="sumDaily">0 次</b></div><div class="v6w"><small>錯題複習</small><b id="sumWrong">0 次</b></div><div class="v6w"><small>完整模考</small><b id="sumMock">0 次</b></div></div></div>`;
if(daily)daily.parentNode.insertBefore(sec,daily);else d.querySelector('main')?.prepend(sec);
const modal=d.createElement('div');modal.className='v6modal';modal.id='v6ParentModal';modal.innerHTML=`<div class="v6report"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><div style="font-size:11px;font-weight:900;color:#2762dd">PARENT LEARNING REPORT</div><h2>英文學習週報</h2><div id="reportStudent" style="color:#66758b;font-size:12px"></div></div><button class="btn secondary" id="closeReport">關閉</button></div><div class="v6reportgrid"><div class="v6r"><small>近 7 日學習活動</small><b id="reportActs">0</b></div><div class="v6r"><small>連續學習</small><b id="reportStreak">0 天</b></div><div class="v6r"><small>目前首要弱點</small><b id="reportWeak" style="font-size:14px">—</b></div></div><div class="v6line"></div><h3>本週完成情況</h3><div id="reportTasks" style="font-size:13px;line-height:1.9;color:#536178"></div><h3>系統建議</h3><div id="reportAdvice" style="background:#f6f8fc;border-left:4px solid #2762dd;padding:12px;border-radius:8px;font-size:13px;line-height:1.7"></div><div class="v6line"></div><div class="v6reportActions"><button class="btn primary" id="printReport">列印／存成 PDF</button><button class="btn secondary" id="copyReport">複製摘要</button></div></div>`;d.body.appendChild(modal);
const go=id=>{const el=d.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};d.getElementById('v6GoDaily').onclick=()=>{go('daily');saveAct('dashboard-open-daily')};d.getElementById('v6GoMock').onclick=()=>{go('weekly');saveAct('dashboard-open-mock')};d.getElementById('v6GoWrong').onclick=()=>{const btn=[...d.querySelectorAll('button,a')].find(x=>/錯題/.test(x.textContent||''));if(btn)btn.click();else go('daily');saveAct('wrong-review')};d.getElementById('v6Center').onclick=()=>{const el=d.getElementById('learningCenter')||[...d.querySelectorAll('section')].find(x=>/學習中心/.test(x.textContent||''));if(el)el.scrollIntoView({behavior:'smooth'});else go('daily')};d.getElementById('v6Parent').onclick=()=>{fillReport();modal.classList.add('show')};d.getElementById('closeReport').onclick=()=>modal.classList.remove('show');d.getElementById('printReport').onclick=()=>d.defaultView.print();d.getElementById('copyReport').onclick=async()=>{const text=reportText();try{await navigator.clipboard.writeText(text);alert('學習週報摘要已複製')}catch(e){prompt('請複製以下內容',text)}};
let hooked=false;d.addEventListener('click',e=>{const t=e.target.closest('button,.opt,a');if(!t)return;const tx=(t.textContent||'').trim();if(/交卷|提交.*模考|完成模考/.test(tx))saveAct('mock');else if(/重新驗證|錯題再練|錯題複習/.test(tx))saveAct('wrong-review');else if(t.classList.contains('opt')||/下一題|完成今日|開始.*題/.test(tx)){if(!hooked||t.classList.contains('opt')){saveAct('daily');hooked=true;setTimeout(()=>hooked=false,1500)}}},true);
renderDash();return true}
function reportText(){const p=profile(),w=weekActs(),tp=todayProgress(),weak=weakSkill();return `英文學習週報\n學生：${p.nickname||p.name||'學生'}\n近7日學習活動：${w.length}\n連續學習：${streak()}天\n目前首要弱點：${weak}\n今日任務：每日練習${tp.practice?'已完成':'未完成'}、錯題複習${tp.wrong?'已完成':'未完成'}、Weekly Mock${tp.mock?'已完成':'待完成'}\n建議：${weak==='等待更多作答資料'?'先完成每日練習與一次 Weekly Mock，系統才能建立較可靠的弱點圖。':`接下來優先安排 ${weak} 的同能力變式題，並在下一次 Weekly Mock 再驗證。`}`}
function fillReport(){const d=actualDoc();if(!d)return;const p=profile(),w=weekActs(),tp=todayProgress(),weak=weakSkill();d.getElementById('reportStudent').textContent=`${p.nickname||p.name||'學生'}｜${p.school||'學校未填'}｜${p.grade||''}`;d.getElementById('reportActs').textContent=w.length;d.getElementById('reportStreak').textContent=streak()+' 天';d.getElementById('reportWeak').textContent=weak;d.getElementById('reportTasks').innerHTML=`今日個人化練習：<b>${tp.practice?'已完成':'未完成'}</b><br>錯題再驗證：<b>${tp.wrong?'已完成':'未完成'}</b><br>Weekly Mock：<b>${tp.mock?'已完成':'本週待完成'}</b>`;d.getElementById('reportAdvice').textContent=weak==='等待更多作答資料'?'目前資料仍不足。建議先完成每日練習與至少一次 Weekly Mock，之後系統會依失分能力安排更有針對性的複習。':`目前優先補強「${weak}」。建議每日個人化練習完成後，再做一次同能力錯題驗證；下一次 Weekly Mock 用來確認弱點是否已改善。`}
function renderDash(){const d=actualDoc();if(!d||!d.getElementById('v6Dashboard'))return;const p=profile(),tp=todayProgress(),w=weekActs();const done=[tp.practice,tp.wrong,tp.mock].filter(Boolean).length;const set=(id,v)=>{const e=d.getElementById(id);if(e)e.textContent=v};set('v6Hello',`${p.nickname||p.name||'同學'}，今天要完成什麼？`);set('v6Today',done+' / 3');set('v6Streak',streak()+' 天');set('v6WeekCount',w.length);set('v6Weak',weakSkill());set('v6Mock',latestMock());set('sumActs',w.length);set('sumDaily',w.filter(x=>x.type==='daily').length+' 次');set('sumWrong',w.filter(x=>x.type==='wrong-review').length+' 次');set('sumMock',w.filter(x=>x.type==='mock').length+' 次');const st=(id,on,a,b)=>{const e=d.getElementById(id);if(e)e.textContent=on?a:b};st('stateDaily',tp.practice,'今日已完成','尚未完成');st('stateWrong',tp.wrong,'今日已複習','尚未完成');st('stateMock',tp.mock,'本週已完成','本週待完成')}
root.addEventListener('load',()=>{let n=0;const timer=setInterval(()=>{n++;if(inject()||n>40)clearInterval(timer)},250)});setInterval(renderDash,2500)
})();
</script></body></html>
