<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V5</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="outer" src="./final-v4.html?v=5"></iframe><script>
(function(){
 const outer=document.getElementById('outer');
 function boot(){
  const od=outer.contentDocument; if(!od)return;
  const inner=od.getElementById('app'); if(!inner)return;
  const run=()=>{try{enhance(inner.contentDocument,inner.contentWindow)}catch(e){console.error('V5 enhance failed',e)}};
  if(inner.contentDocument&&inner.contentDocument.readyState==='complete') run(); else inner.addEventListener('load',()=>setTimeout(run,100),{once:true});
 }
 outer.addEventListener('load',()=>setTimeout(boot,120));
 function enhance(d,w){
   if(!d||d.getElementById('learningCenter'))return;
   d.title='2027 會考英文 AI｜完整產品 V5';
   const css=d.createElement('style');css.textContent=`
   .learnCenter{padding:28px 0}.lcTabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.lcTab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:850;color:#536178}.lcTab.active{background:var(--n);color:#fff;border-color:var(--n)}.lcPanel{display:none}.lcPanel.active{display:block}.lcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.lcCard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.lcCard small{color:var(--mut)}.lcCard b{display:block;margin-top:5px;color:var(--n);font-size:19px}.timeline{display:grid;gap:8px}.timeItem{display:grid;grid-template-columns:110px 1fr;gap:12px;border-left:3px solid #dbe6fb;padding:8px 10px;background:#fff;border-radius:0 12px 12px 0}.timeItem time{font-size:11px;color:#788496}.timeItem b{font-size:13px;color:var(--n)}.timeItem p{margin:3px 0 0;font-size:11px;color:#66758b}.noteTools{display:grid;grid-template-columns:160px 1fr auto;gap:8px;margin-bottom:10px}.noteList{display:grid;gap:8px}.noteItem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.noteItem header{display:flex;justify-content:space-between;gap:8px}.noteItem strong{font-size:12px;color:var(--n)}.noteItem p{font-size:12px;line-height:1.65;color:#58667a;margin:7px 0 0}.miniTrend{display:grid;gap:10px}.trendRow{display:grid;grid-template-columns:120px 1fr 48px;gap:8px;align-items:center;font-size:12px}.trendBar{height:10px;border-radius:99px;background:#edf1f6;overflow:hidden}.trendBar i{display:block;height:100%;background:var(--b)}.mockHist{display:grid;gap:8px}.mockHistItem{display:grid;grid-template-columns:120px 1fr 80px;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.emptyState{background:#fff;border:1px dashed #cfd8e6;border-radius:14px;padding:20px;text-align:center;color:#6d798b;font-size:12px}.profileStrip{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr;gap:8px;margin:10px 0}.profileStrip>div{background:#f7f9fd;border:1px solid var(--line);border-radius:12px;padding:10px}.profileStrip small{display:block;color:#7a8697;font-size:10px}.profileStrip b{display:block;color:var(--n);margin-top:3px}.helper{font-size:11px;color:#6b7788;line-height:1.6}.saveBtn{border:0;border-radius:10px;background:var(--b);color:#fff;padding:9px 12px;font-weight:850}.dangerText{color:#b44141}.trendHint{font-size:11px;color:#6e7b8f;margin-top:8px}@media(max-width:850px){.lcGrid,.profileStrip{grid-template-columns:1fr 1fr}.noteTools{grid-template-columns:1fr}.mockHistItem{grid-template-columns:1fr}.timeItem{grid-template-columns:1fr}}@media(max-width:520px){.lcGrid,.profileStrip{grid-template-columns:1fr}}
   `;d.head.appendChild(css);
   const anchor=d.getElementById('daily')||d.getElementById('weekly')||d.getElementById('history'); if(!anchor)return;
   const sec=d.createElement('section');sec.id='learningCenter';sec.className='section learnCenter';sec.innerHTML=`<h2>我的學習中心</h2><p class="lead">把每日練習、錯題、筆記、能力變化與 Weekly Mock 放在同一個地方。資料會隨你的操作持續累積。</p><div id="profileStrip" class="profileStrip"></div><div class="lcTabs"><button class="lcTab active" data-tab="overview">總覽</button><button class="lcTab" data-tab="history">學習歷程</button><button class="lcTab" data-tab="notes">AI 筆記</button><button class="lcTab" data-tab="trend">弱點趨勢</button><button class="lcTab" data-tab="mocks">模考紀錄</button></div><div id="lcOverview" class="lcPanel active"></div><div id="lcHistory" class="lcPanel"></div><div id="lcNotes" class="lcPanel"></div><div id="lcTrend" class="lcPanel"></div><div id="lcMocks" class="lcPanel"></div>`;
   anchor.parentNode.insertBefore(sec,anchor);
   const links=d.querySelector('.links'); if(links&&!d.querySelector('a[href="#learningCenter"]')){const a=d.createElement('a');a.href='#learningCenter';a.textContent='學習中心';links.insertBefore(a,links.firstChild)}
   d.querySelectorAll('.lcTab').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
   function switchTab(tab){d.querySelectorAll('.lcTab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));d.querySelectorAll('.lcPanel').forEach(x=>x.classList.remove('active'));const map={overview:'lcOverview',history:'lcHistory',notes:'lcNotes',trend:'lcTrend',mocks:'lcMocks'};d.getElementById(map[tab]).classList.add('active');renderAll()}
   function safeParse(s,f){try{return JSON.parse(s)}catch(e){return f}}
   function allStorage(){const out={};for(let i=0;i<w.localStorage.length;i++){const k=w.localStorage.key(i);out[k]=safeParse(w.localStorage.getItem(k),w.localStorage.getItem(k))}return out}
   function findProfile(){const store=allStorage();let best={};for(const [k,v] of Object.entries(store)){if(v&&typeof v==='object'&&!Array.isArray(v)){const score=['name','studentName','school','grade','plan','tier','track','nickname'].filter(x=>x in v).length;if(score>Object.keys(best).filter(x=>!x.startsWith('_')).length)best={...v,_key:k}}}return best}
   function labelPlan(p){const s=String(p||'').toLowerCase();return /complete|paid|pro|完整/.test(s)?'AI Complete':'Free 免費會員'}
   function logActivity(title,detail){const key='capV5Activity';let arr=safeParse(w.localStorage.getItem(key),'[]');if(!Array.isArray(arr))arr=[];arr.unshift({ts:Date.now(),title,detail:detail||''});arr=arr.slice(0,60);w.localStorage.setItem(key,JSON.stringify(arr));renderAll()}
   function getActs(){const arr=safeParse(w.localStorage.getItem('capV5Activity'),'[]');return Array.isArray(arr)?arr:[]}
   function getNotes(){const a=safeParse(w.localStorage.getItem('capV5Notes'),'[]');return Array.isArray(a)?a:[]}
   function saveNotes(a){w.localStorage.setItem('capV5Notes',JSON.stringify(a));renderAll()}
   function currentSkills(){const data={};d.querySelectorAll('.skillrow').forEach(r=>{const name=(r.children[0]?.textContent||'').trim();const pct=(r.children[2]?.textContent||'').match(/\d+/);if(name&&pct)data[name]=Number(pct[0])});return data}
   function saveSkillSnapshot(){const now=currentSkills();if(!Object.keys(now).length)return;let arr=safeParse(w.localStorage.getItem('capV5SkillTrend'),'[]');if(!Array.isArray(arr))arr=[];const today=new Date().toISOString().slice(0,10);if(arr[0]?.date===today)arr[0]={date:today,skills:now};else arr.unshift({date:today,skills:now});w.localStorage.setItem('capV5SkillTrend',JSON.stringify(arr.slice(0,16)))}
   function getMocks(){const a=safeParse(w.localStorage.getItem('capV5MockHistory'),'[]');return Array.isArray(a)?a:[]}
   function captureMock(){setTimeout(()=>{const report=d.querySelector('.report.show')||d.querySelector('.report');if(!report)return;const txt=report.innerText||'';const m=txt.match(/(\d{1,3})\s*%/);const read=txt.match(/閱讀[^\d]*(\d+)\s*\/\s*43/);const listen=txt.match(/聽力[^\d]*(\d+)\s*\/\s*21/);if(!m&&!read&&!listen)return;let arr=getMocks();arr.unshift({ts:Date.now(),score:m?Number(m[1]):null,reading:read?Number(read[1]):null,listening:listen?Number(listen[1]):null});w.localStorage.setItem('capV5MockHistory',JSON.stringify(arr.slice(0,20)));logActivity('完成 Weekly Mock',m?`整體正確率 ${m[1]}%`:'已完成本週模考')},700)}
   function renderProfile(){const p=findProfile();const name=p.name||p.studentName||p.nickname||'尚未建立';const school=p.school||'—';const grade=p.grade||'—';const track=p.track||p.route||'—';const plan=labelPlan(p.plan||p.tier||p.membership);d.getElementById('profileStrip').innerHTML=`<div><small>學生</small><b>${esc(name)}</b></div><div><small>方案</small><b>${esc(plan)}</b></div><div><small>學校／年級</small><b>${esc(school)} ${esc(grade)}</b></div><div><small>學習路徑</small><b>${esc(track)}</b></div>`}
   function renderOverview(){const acts=getActs(),notes=getNotes(),mocks=getMocks(),skills=currentSkills();const weak=Object.entries(skills).sort((a,b)=>a[1]-b[1])[0];d.getElementById('lcOverview').innerHTML=`<div class="lcGrid"><div class="lcCard"><small>最近學習</small><b>${acts.length?timeAgo(acts[0].ts):'尚無紀錄'}</b><div class="helper">完成每日題、錯題重練或模考後會自動增加。</div></div><div class="lcCard"><small>目前最需補強</small><b>${weak?esc(weak[0]):'等待資料'}</b><div class="helper">依能力面板與錯題紀錄更新。</div></div><div class="lcCard"><small>個人筆記</small><b>${notes.length} 則</b><div class="helper">可自己新增，也可整理錯題重點。</div></div><div class="lcCard"><small>Weekly Mock</small><b>${mocks.length?mocks.length+' 次':'尚未完成'}</b><div class="helper">完成後會保存閱讀、聽力與整體表現。</div></div></div><div class="card" style="margin-top:12px"><h3 style="margin-top:0;color:var(--n)">下一步建議</h3><p class="helper">${weak?`先回到今日練習，優先處理「${esc(weak[0])}」相關題型；完成後再看弱點趨勢是否上升。`:'先完成一輪今日練習，系統才有足夠資料建立你的第一份弱點圖。'}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="document.getElementById('daily').scrollIntoView({behavior:'smooth'})">前往今日練習</button><button class="btn secondary" onclick="document.querySelector('[data-tab=trend]').click();document.getElementById('learningCenter').scrollIntoView({behavior:'smooth'})">查看能力趨勢</button></div></div>`}
   function renderHistory(){const acts=getActs();d.getElementById('lcHistory').innerHTML=acts.length?`<div class="timeline">${acts.map(a=>`<div class="timeItem"><time>${fmt(a.ts)}</time><div><b>${esc(a.title)}</b><p>${esc(a.detail||'')}</p></div></div>`).join('')}</div>`:`<div class="emptyState">目前還沒有學習歷程。開始每日練習、重練錯題或完成 Weekly Mock 後，這裡會自動累積。</div>`}
   function renderNotes(){const notes=getNotes();d.getElementById('lcNotes').innerHTML=`<div class="noteTools"><select id="noteCat"><option>單字</option><option>片語</option><option>文法／句型</option><option>閱讀策略</option><option>聽力策略</option><option>其他</option></select><input id="noteText" placeholder="例如：since + 時間點；for + 一段時間"><button class="saveBtn" id="saveNote">新增筆記</button></div><div class="noteList">${notes.length?notes.map((n,i)=>`<div class="noteItem"><header><strong>${esc(n.cat)}</strong><button class="btn secondary" data-del-note="${i}" style="padding:5px 8px;font-size:10px">刪除</button></header><p>${esc(n.text)}</p></div>`).join(''):'<div class="emptyState">目前沒有個人筆記。你可以先把今天最容易忘記的單字、句型或策略記下來。</div>'}</div>`;d.getElementById('saveNote').onclick=()=>{const t=d.getElementById('noteText').value.trim();if(!t)return;const a=getNotes();a.unshift({cat:d.getElementById('noteCat').value,text:t,ts:Date.now()});saveNotes(a.slice(0,100));logActivity('新增 AI 學習筆記',t)};d.querySelectorAll('[data-del-note]').forEach(b=>b.onclick=()=>{const a=getNotes();a.splice(Number(b.dataset.delNote),1);saveNotes(a)})}
   function renderTrend(){saveSkillSnapshot();const arr=safeParse(w.localStorage.getItem('capV5SkillTrend'),'[]');const snaps=Array.isArray(arr)?arr:[];const latest=snaps[0]?.skills||currentSkills();const prev=snaps[1]?.skills||{};if(!Object.keys(latest).length){d.getElementById('lcTrend').innerHTML='<div class="emptyState">完成幾題練習後，這裡會開始建立 Vocabulary、Grammar、Inference、Listening 等能力趨勢。</div>';return}d.getElementById('lcTrend').innerHTML=`<div class="miniTrend">${Object.entries(latest).map(([k,v])=>{const diff=prev[k]==null?'':v-prev[k];return `<div class="trendRow"><b>${esc(k)}</b><div class="trendBar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div><span>${v}%${diff===''?'':` ${diff>0?'▲':diff<0?'▼':'•'}${Math.abs(diff)}`}</span></div>`}).join('')}</div><div class="trendHint">${snaps.length<2?'目前只有第一筆快照；完成之後的練習，下一次回來即可看到變化。':'箭頭表示和上一筆能力快照相比的變化。'}</div>`}
   function renderMocks(){const a=getMocks();d.getElementById('lcMocks').innerHTML=a.length?`<div class="mockHist">${a.map((m,i)=>`<div class="mockHistItem"><div><b>Weekly Mock ${a.length-i}</b><div class="helper">${fmt(m.ts)}</div></div><div class="helper">閱讀 ${m.reading==null?'—':m.reading+'/43'}　聽力 ${m.listening==null?'—':m.listening+'/21'}</div><b>${m.score==null?'完成':m.score+'%'}</b></div>`).join('')}</div>`:`<div class="emptyState">尚未留下 Weekly Mock 紀錄。完整會員完成模考交卷後，這裡會保存結果。</div>`}
   function renderAll(){renderProfile();renderOverview();renderHistory();renderNotes();renderTrend();renderMocks()}
   function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
   function fmt(ts){try{return new Intl.DateTimeFormat('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}catch(e){return ''}}
   function timeAgo(ts){const m=Math.max(0,Math.floor((Date.now()-ts)/60000));if(m<1)return'剛剛';if(m<60)return`${m} 分鐘前`;const h=Math.floor(m/60);if(h<24)return`${h} 小時前`;return`${Math.floor(h/24)} 天前`}
   d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=(b.textContent||'').trim();if(/開始今日|今日.*題|開始練習/.test(t))logActivity('開始今日練習',t);else if(/重新驗證|重練|變式/.test(t))logActivity('進行錯題再驗證',t);else if(/交卷|完成本週模考/.test(t)){logActivity('送出 Weekly Mock','等待成績產生');captureMock()}else if(/標記已掌握/.test(t))logActivity('標記弱點已掌握',t)},true);
   renderAll();
 }
})();
</script></body></html>
