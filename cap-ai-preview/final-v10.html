<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V10</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v9" src="./final-v9.html?v=10"></iframe><script>(function(){const root=document.getElementById('v9');function deepestDoc(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<12;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}const sets=[{title:'take part in / join / attend',keys:['take part in','join','attend'],rows:[['take part in','參加活動','take part in + 活動','take part in the contest'],['join','加入團體／加入某人','join + 團體/人','join the club / join us'],['attend','出席活動','attend + meeting/class/event','attend the meeting']],mistake:'把 attend 後面再加 in，或把 join 用在單純出席活動。',tip:'團體用 join；活動「參與」可用 take part in；單純出席用 attend。'},{title:'arrive / reach / get to',keys:['arrive','reach','get to'],rows:[['arrive','到達','arrive in + 大地方；arrive at + 小地方','arrive in Taipei / at school'],['reach','到達','reach + 地點，不加介系詞','reach the station'],['get to','到達','get to + 地點','get to the airport']],mistake:'reach 後面又加 at/in，或 arrive 後面直接接地點。',tip:'reach 最乾脆，後面直接接地點；arrive 要看 in/at。'},{title:'happen / take place',keys:['happen','take place'],rows:[['happen','發生','常指偶發事件','The accident happened yesterday.'],['take place','舉行／發生','常指有安排的活動','The meeting will take place Friday.']],mistake:'把預先安排的比賽、典禮一律用 happen。',tip:'有安排的活動優先想 take place；意外事件想 happen。'},{title:'find / find out / look for',keys:['find','find out','look for'],rows:[['find','找到','強調找到的結果','I found my key.'],['find out','查明','find out + 資訊/真相','Find out the answer.'],['look for','尋找','強調尋找過程','I am looking for my key.']],mistake:'「正在找」卻用 find，或「查出資訊」只用 find。',tip:'過程 look for；結果 find；查明資訊 find out。'},{title:'used to / be used to / get used to',keys:['used to','be used to','get used to'],rows:[['used to + V','過去常常','現在通常已不同','I used to walk to school.'],['be used to + N/V-ing','習慣於','已經習慣','I am used to getting up early.'],['get used to + N/V-ing','逐漸習慣','正在適應','I am getting used to the weather.']],mistake:'used to 後接 V-ing，或 be used to 後接原形動詞。',tip:'看到 be/get used to，to 是介系詞，後面用名詞或 V-ing。'},{title:'hear / listen to',keys:['hear','listen to'],rows:[['hear','聽見','被動接收到聲音','I heard a strange sound.'],['listen to','聽','主動專心聽','Listen to the teacher.']],mistake:'listen 後忘了 to。',tip:'hear 是聽見結果；listen to 是主動去聽。'},{title:'bring / take / carry',keys:['bring','take','carry'],rows:[['bring','帶來','帶到說話者這裡','Bring your book here.'],['take','帶走','帶離說話者這裡','Take this umbrella with you.'],['carry','攜帶／搬運','強調拿著、搬著','He carried the box upstairs.']],mistake:'沒判斷方向，只靠中文「帶」。',tip:'bring 朝這裡；take 離開這裡；carry 強調搬運動作。'},{title:'win / beat',keys:['win','beat'],rows:[['win','贏得','win + 比賽/獎項','win the game / prize'],['beat','擊敗','beat + 對手','beat the other team']],mistake:'win 後接人，或 beat 後接獎項。',tip:'贏「東西」用 win；打敗「人/隊伍」用 beat。'},{title:'wear / put on / dress',keys:['wear','put on','dress'],rows:[['wear','穿著','狀態','She is wearing a coat.'],['put on','穿上','動作','Put on your coat.'],['dress','給…穿衣／穿衣','dress + 人；get dressed','She dressed the child.']],mistake:'把穿上的動作和穿著狀態混在一起。',tip:'狀態 wear；動作 put on；dress 常跟「人」有關。'},{title:'miss / lose',keys:['miss','lose'],rows:[['miss','錯過／想念','miss the bus / miss someone','I missed the train.'],['lose','遺失／輸掉','lose a key / game','I lost my wallet.']],mistake:'「錯過公車」用 lose。',tip:'錯過時間或機會用 miss；弄丟物品用 lose。'},{title:'learn / study',keys:['learn','study'],rows:[['learn','學會／得知','強調獲得知識結果','learn English / learn to swim'],['study','研讀','強調學習過程','study English for two hours']],mistake:'只看中文「學」而忽略結果或過程。',tip:'study 是過程；learn 偏向學到、學會。'},{title:'remember / remind',keys:['remember','remind'],rows:[['remember','記得','人自己記得','Remember the meeting.'],['remind','提醒','remind + 人 + to V / of N','Remind me to call her.']],mistake:'把「提醒某人」寫成 remember someone。',tip:'自己記得 remember；讓別人記得 remind。'},{title:'leave / forget',keys:['leave','forget'],rows:[['leave','把東西忘在某處','leave + 物 + 地點','I left my phone at home.'],['forget','忘記事情／忘帶','forget + N / to V','I forgot my phone.']],mistake:'已說明遺留地點卻仍只用 forget。',tip:'若句子出現「忘在某地」，優先想 leave。'},{title:'rise / raise',keys:['rise','raise'],rows:[['rise','上升','不及物，自己上升','The sun rises at six.'],['raise','提高／舉起','及物，要有受詞','Raise your hand.']],mistake:'raise 後沒有受詞，或 rise 後硬接受詞。',tip:'raise 要「提高某物」；rise 是某物自己上升。'},{title:'lie / lay',keys:['lie','lay'],rows:[['lie','躺','lie-lay-lain，不及物','He lay on the sofa.'],['lay','放置','lay-laid-laid，及物','She laid the book on the desk.']],mistake:'現在式與過去式長得很像，常把 lay 當成「躺」的原形。',tip:'lay 原形一定要有受詞；lie 不直接接受詞。'}];function styles(d){if(d.getElementById('v10styles'))return;const st=d.createElement('style');st.id='v10styles';st.textContent='.collocBox{margin-top:12px;border:1px solid #d9e3f0;border-radius:14px;overflow:hidden;background:#fff}.collocHead{background:#174f7c;color:#fff;padding:10px 12px;font-weight:900}.collocWarn{padding:9px 12px;background:#fff2f2;color:#8d3535;font-size:12px;line-height:1.6}.collocTip{padding:9px 12px;background:#eef8f4;color:#176647;font-size:12px;line-height:1.6}.collocTable{width:100%;border-collapse:collapse;font-size:12px}.collocTable th,.collocTable td{padding:8px;border-top:1px solid #edf1f5;text-align:left;vertical-align:top}.collocTable th{background:#f7f9fc;color:#536178}.collocBtns{display:flex;gap:7px;padding:10px 12px;flex-wrap:wrap}.collocBtns button{border:1px solid #d8e1ec;background:#fff;border-radius:9px;padding:7px 9px;font-weight:800;color:#3158ba;cursor:pointer}.collocGrid{display:grid;gap:10px;margin-top:12px}.collocSearch{width:100%;padding:10px 12px;border:1px solid #d8e1ec;border-radius:10px}@media(max-width:650px){.collocTable{font-size:11px}.collocTable th:nth-child(4),.collocTable td:nth-child(4){display:none}}';d.head.appendChild(st)}function saveNote(s){let arr=[];try{arr=JSON.parse(localStorage.getItem('capAINotes')||'[]')}catch(e){}arr.push({type:'Collocation / Near-synonym',title:s.title,content:s.rows.map(r=>r.join('｜')).join('\n')+'\n常見錯法：'+s.mistake+'\n判斷線索：'+s.tip,createdAt:new Date().toISOString(),source:'V10 Collocation'});localStorage.setItem('capAINotes',JSON.stringify(arr));alert('已收進 AI 筆記：'+s.title)}function render(s){return '<div class="collocBox"><div class="collocHead">近義字／搭配診斷｜'+esc(s.title)+'</div><table class="collocTable"><thead><tr><th>字詞</th><th>核心意思</th><th>固定搭配</th><th>例句</th></tr></thead><tbody>'+s.rows.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>').join('')+'</tbody></table><div class="collocWarn"><b>常見錯法：</b>'+esc(s.mistake)+'</div><div class="collocTip"><b>判斷線索：</b>'+esc(s.tip)+'</div><div class="collocBtns"><button data-colloc="'+esc(s.title)+'">收進 AI 筆記</button></div></div>'}function bind(box){box.querySelectorAll('[data-colloc]').forEach(b=>{const s=sets.find(x=>x.title===b.dataset.colloc);if(s)b.onclick=()=>saveNote(s)})}function detect(text){const t=String(text||'').toLowerCase();let best=null,score=0;for(const s of sets){let sc=0;s.keys.forEach(k=>{if(t.includes(k))sc++});if(sc>score){score=sc;best=s}}return score?best:null}function enhance(d){d.querySelectorAll('.explain,.wrongItem,.diagnosisCard,.aiDiagnosis,.confusionBox,.modal .mbody').forEach(n=>{if(n.dataset.v10done)return;const s=detect(n.innerText);if(!s)return;n.dataset.v10done='1';n.insertAdjacentHTML('beforeend',render(s));bind(n)})}function library(d){if(d.getElementById('collocationLibrary'))return;const anchor=d.getElementById('confusionLibrary')||d.getElementById('daily')||d.querySelector('main');if(!anchor)return;const sec=d.createElement('section');sec.className='section';sec.id='collocationLibrary';sec.innerHTML='<h2>近義字與 Collocation 診斷庫</h2><p class="lead">很多會考失分不是不認得單字，而是知道中文卻不知道搭配。這裡直接比較「意思＋句型＋常見錯法」。</p><input class="collocSearch" id="collocSearch" placeholder="例如：arrive、join、used to、win"><div id="collocResults" class="collocGrid">'+sets.slice(0,5).map(render).join('')+'</div>';anchor.parentNode.insertBefore(sec,anchor.nextSibling);const inp=sec.querySelector('#collocSearch'),res=sec.querySelector('#collocResults');bind(res);inp.oninput=()=>{const q=inp.value.trim().toLowerCase();const list=!q?sets.slice(0,5):sets.filter(s=>s.title.toLowerCase().includes(q)||s.keys.some(k=>k.includes(q))||s.rows.some(r=>r.join(' ').toLowerCase().includes(q)));res.innerHTML=(list.length?list:sets.slice(0,5)).map(render).join('');bind(res)};const nav=d.querySelector('.links');if(nav){const a=d.createElement('a');a.href='#collocationLibrary';a.textContent='近義字搭配';nav.appendChild(a)}}function boot(){const d=deepestDoc();if(!d)return;styles(d);library(d);enhance(d);if(!d.defaultView.__v10observer){d.defaultView.__v10observer=true;new MutationObserver(()=>enhance(d)).observe(d.body,{childList:true,subtree:true})}d.title='2027 會考英文 AI｜完整產品 V10'}root.addEventListener('load',()=>{setTimeout(boot,900);setTimeout(boot,2200)});setInterval(boot,3000)})();</script></body></html>
