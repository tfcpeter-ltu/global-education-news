<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 會考英文 AI｜完整產品 V13</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v12" src="./final-v12.html?v=13"></iframe><script>(function(){const root=document.getElementById('v12');function deepest(){try{let d=root.contentDocument;if(!d)return null;for(let i=0;i<14;i++){const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}catch(e){return null}}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}const microDB={grammar:[{q:'Which sentence is correct?',o:['She has lived here for three years.','She lived here since three years.','She has live here for three years.','She is living here since three years.'],a:0,why:'for 後接一段時間；現在完成式使用 has/have + p.p.'},{q:'Kevin ___ in Taipei since 2024.',o:['lives','lived','has lived','is live'],a:2,why:'since + 時間起點，且狀態延續到現在，使用現在完成式。'},{q:'Mia has studied English ___ five years.',o:['since','for','at','during'],a:1,why:'five years 是一段時間，所以使用 for。'}],vocab:[{q:'Please ___ at the picture on the wall.',o:['see','watch','look','hear'],a:2,why:'look at 表示把視線看向某物。'},{q:'We stayed home ___ the heavy rain.',o:['because','because of','although','so'],a:1,why:'後面是名詞片語 the heavy rain，所以用 because of。'},{q:'Can I ___ your pen for a minute?',o:['lend','borrow','keep','pay'],a:1,why:'說話者是借入東西，所以用 borrow。'}],reading:[{q:'A notice says the library closes at 5 p.m. on Friday. Amy arrives at 5:20. What is most likely true?',o:['She can enter normally.','The library is already closed.','The library opens at 5:20.','Friday is a holiday.'],a:1,why:'先抓時間 5:00 與 5:20，再做直接比對。'},{q:'Tom wanted to buy the bike. However, it was too expensive. What does “however” show?',o:['A result','A contrast','A time order','An example'],a:1,why:'however 是轉折訊號，表示前後意思有反差。'},{q:'The article says Ben trained every day and finally won the race. Which idea is best supported?',o:['Ben was lucky only.','Practice helped Ben improve.','Ben disliked running.','The race was canceled.'],a:1,why:'推論必須有文章證據；每天訓練＋最後獲勝支持練習帶來進步。'}],listening:[{q:'You hear: “I don’t need the blue one. I’ll take the red one.” What color does the speaker choose?',o:['Blue','Red','Green','Black'],a:1,why:'否定詞 don’t 先排除 blue，後句 take the red one 才是最後選擇。'},{q:'You hear: “The train leaves at fifteen thirty.” What time is that?',o:['3:13','3:30','5:30','1:53'],a:1,why:'fifteen thirty = 15:30，也就是下午 3:30。'},{q:'You hear: “I thought the movie was boring at first, but the ending was amazing.” What is the speaker’s final attitude?',o:['Positive','Angry','Uncertain','Negative'],a:0,why:'but 後面是最後評價，amazing 顯示正向態度。'}]};function getSkill(text){const t=String(text||'').toLowerCase();if(/listening|聽力|hear|audio/.test(t))return'listening';if(/main idea|inference|reference|detail|閱讀|article|passage/.test(t))return'reading';if(/grammar|文法|tense|since|for|passive|relative/.test(t))return'grammar';return'vocab'}function saveMastery(skill,passed){let arr=[];try{arr=JSON.parse(localStorage.getItem('cap13Mastery')||'[]')}catch(e){};arr.push({skill,passed,at:new Date().toISOString(),status:passed?'temporary_mastery':'needs_review'});localStorage.setItem('cap13Mastery',JSON.stringify(arr));let sched=[];try{sched=JSON.parse(localStorage.getItem('cap13ReviewSchedule')||'[]')}catch(e){};if(passed){const now=Date.now();[2,7,24].forEach(days=>sched.push({skill,reviewAt:new Date(now+days*86400000).toISOString(),stage:days===2?'1–3 天':days===7?'7 天':'21–30 天'}));localStorage.setItem('cap13ReviewSchedule',JSON.stringify(sched))}}function styles(d){if(d.getElementById('v13style'))return;const s=d.createElement('style');s.id='v13style';s.textContent='.microBox{margin-top:12px;border:1px solid #cfdcef;border-radius:15px;background:#fff;overflow:hidden}.microHead{background:linear-gradient(135deg,#102a4c,#2762dd);color:#fff;padding:11px 13px;font-weight:900}.microProgress{display:flex;gap:6px;padding:10px 12px;background:#f7f9fc}.microStep{flex:1;text-align:center;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:850;background:#e9eef6;color:#66758b}.microStep.done{background:#e7f6ee;color:#176647}.microStep.now{background:#fff3d8;color:#7a5d17}.microBody{padding:12px}.microBody h4{margin:0 0 9px;color:#102a4c}.microOpt{display:block;width:100%;text-align:left;margin:6px 0;border:1px solid #dbe3ee;background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}.microOpt.good{background:#edf8f2;border-color:#8bc4a6}.microOpt.bad{background:#fff1f1;border-color:#e4abab}.microExplain{margin-top:9px;background:#f7f9fc;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.6;color:#586678}.microResult{padding:12px;background:#f7fbff;border-top:1px solid #dfe8f2}.microStart{border:0;border-radius:9px;background:#102a4c;color:#fff;padding:8px 11px;font-weight:850;cursor:pointer}.reviewPlan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.reviewPlan div{background:#fff;border:1px solid #e0e7ef;border-radius:9px;padding:8px;text-align:center;font-size:11px}@media(max-width:650px){.reviewPlan{grid-template-columns:1fr}}';d.head.appendChild(s)}function makeBox(skill){return '<div class="microBox" data-micro-skill="'+skill+'"><div class="microHead">3 題微型補救訓練</div><div class="microProgress"><div class="microStep now">1 規則確認</div><div class="microStep">2 換情境</div><div class="microStep">3 干擾辨識</div></div><div class="microBody"><p style="margin-top:0;color:#66758b;font-size:12px">三題都答對，才暫時標記為掌握；之後仍會安排間隔複習。</p><button class="microStart">開始 3 題補救</button></div></div>'}function run(box,skill){const qs=(microDB[skill]||microDB.vocab).slice(0,3);let i=0,ok=0;const steps=[...box.querySelectorAll('.microStep')],body=box.querySelector('.microBody');function render(){steps.forEach((s,idx)=>{s.classList.toggle('done',idx<i);s.classList.toggle('now',idx===i)});if(i>=qs.length){const pass=ok===3;saveMastery(skill,pass);body.innerHTML='<div class="microResult"><h4>'+(pass?'暫時掌握 ✓':'仍需補強')+'</h4><p>'+(pass?'三題都通過。這個弱點先標記為「暫時掌握」，但系統會在 1–3 天、7 天、21–30 天再次驗證。':'本輪 '+ok+'/3 題正確。只要其中一題錯，弱點就先保留，不會因一次答對就視為學會。')+'</p><div class="reviewPlan"><div><b>1–3 天</b><br>第一次回測</div><div><b>7 天</b><br>第二次回測</div><div><b>21–30 天</b><br>長期記憶確認</div></div></div>';return}const q=qs[i];body.innerHTML='<h4>第 '+(i+1)+' 題｜'+(['規則確認','換情境','干擾辨識'][i])+'</h4><p>'+esc(q.q)+'</p>'+q.o.map((o,idx)=>'<button class="microOpt" data-i="'+idx+'">'+String.fromCharCode(65+idx)+'. '+esc(o)+'</button>').join('')+'<div class="microExplain" style="display:none"></div>';body.querySelectorAll('.microOpt').forEach(b=>b.onclick=()=>{const pick=Number(b.dataset.i),right=pick===q.a;if(right)ok++;body.querySelectorAll('.microOpt').forEach((x,idx)=>{x.disabled=true;if(idx===q.a)x.classList.add('good');else if(idx===pick&&!right)x.classList.add('bad')});const ex=body.querySelector('.microExplain');ex.style.display='block';ex.innerHTML='<b>'+(right?'答對':'這題還沒掌握')+'</b><br>'+esc(q.why)+'<br><button class="microStart" id="microNext" style="margin-top:8px">'+(i===2?'看結果':'下一題')+'</button>';ex.querySelector('#microNext').onclick=()=>{i++;render()}})});render()}function enhance(d){[...d.querySelectorAll('.explain,.wrongItem,.diagnosisCard,.aiDiagnosis,.readingDiag,.listeningDiag,.modal .mbody')].forEach(n=>{if(n.dataset.v13micro)return;const txt=n.innerText;if(!/錯|wrong|不正確|needs review|診斷/i.test(txt))return;const skill=getSkill(txt);n.dataset.v13micro='1';n.insertAdjacentHTML('beforeend',makeBox(skill));const box=n.querySelector('[data-micro-skill]');box.querySelector('.microStart').onclick=()=>run(box,skill)})}function addHub(d){if(d.getElementById('microHub'))return;const daily=d.getElementById('daily')||d.querySelector('main');if(!daily)return;const sec=d.createElement('section');sec.id='microHub';sec.className='section';sec.innerHTML='<h2>微型補救訓練中心</h2><p class="lead">錯一題，不是再刷十題。先用 3 題確認同一個弱點是不是真的補起來。</p><div class="grid3"><div class="card"><h3>文法補救</h3><p>規則 → 情境 → 干擾選項</p><button class="btn secondary" data-s="grammar">開始</button></div><div class="card"><h3>單字／片語補救</h3><p>字義 → 搭配 → 易混淆字</p><button class="btn secondary" data-s="vocab">開始</button></div><div class="card"><h3>閱讀／聽力補救</h3><p>線索 → 換情境 → 推論干擾</p><button class="btn secondary" data-s="reading">閱讀</button> <button class="btn secondary" data-s="listening">聽力</button></div></div><div id="microHubRun"></div>';daily.parentNode.insertBefore(sec,daily);sec.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const area=sec.querySelector('#microHubRun');area.innerHTML=makeBox(b.dataset.s);const box=area.firstElementChild;box.querySelector('.microStart').onclick=()=>run(box,b.dataset.s)});const nav=d.querySelector('.links');if(nav){const a=d.createElement('a');a.href='#microHub';a.textContent='補救訓練';nav.appendChild(a)}}function boot(){const d=deepest();if(!d)return;styles(d);addHub(d);enhance(d);if(!d.defaultView.__v13obs){d.defaultView.__v13obs=true;new MutationObserver(()=>enhance(d)).observe(d.body,{childList:true,subtree:true})}d.title='2027 會考英文 AI｜完整產品 V13'}root.addEventListener('load',()=>{setTimeout(boot,900);setTimeout(boot,2200)});setInterval(boot,3000)})();</script></body></html>
