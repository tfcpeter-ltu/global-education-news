name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Set up Python for bilingual editions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bilingual-requirements.txt
      - name: Install offline translation dependencies
        run: python -m pip install -r scripts/bilingual-requirements.txt
      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: .bilingual/model
          key: argos-zh-en-1.9
      - name: Install Chinese fonts for share cards
        timeout-minutes: 6
        run: |
          # The runner's Azure mirror can stall on the 61 MB font package.
          # Keep Ubuntu's signed packages, using its official HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y fonts-noto-cjk
      - name: Verify Facebook native photo evidence rules
        run: node scripts/test-facebook-photo-evidence.mjs
      - name: Verify video catalog and playback sequencing
        run: node scripts/test-vlog.mjs
      - name: Build
        run: npm run build
      - name: Verify bilingual routes and form values
        run: python scripts/test-bilingual.py
      - name: Verify education search entry points and article metadata
        run: python scripts/test-education-seo.py
      - name: Verify video controllers in both built editions
        run: node scripts/test-vlog.mjs --built
      - name: Verify public demo and operator safety disclosures
        run: node scripts/test-public-service-safety.mjs
      - name: Prepare changed URLs for IndexNow
        run: node scripts/indexnow.mjs prepare
      - name: Save IndexNow submission
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-submission
          path: indexnow-submission.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-submission
      - name: Notify search engines after live deployment
        run: node scripts/indexnow.mjs submit

