name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Set up Python for bilingual editions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bilingual-requirements.txt
      - name: Install offline translation dependencies
        run: python -m pip install -r scripts/bilingual-requirements.txt
      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: .bilingual/model
          key: argos-zh-en-1.9
      - name: Install Chinese fonts for share cards
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Build
        run: npm run build
      - name: Verify bilingual routes and form values
        run: python scripts/test-bilingual.py
      - name: Prepare changed URLs for IndexNow
        run: node scripts/indexnow.mjs prepare
      - name: Save IndexNow submission
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-submission
          path: indexnow-submission.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-submission
      - name: Notify search engines after live deployment
        run: node scripts/indexnow.mjs submit

