<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留學申請時間表｜留學導航</title><meta name="description" content="依國家、科系、入學年度與英文準備建立可打勾保存的海外大學申請時間表。"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mvp.css"><style>.time-shell{max-width:1180px;margin:auto;padding:0 6vw 110px}.time-context{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.time-controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin:14px 0}.time-controls select{min-height:48px;border:1px solid var(--line);border-radius:11px;padding:0 11px;background:#fff}.time-progress{background:#eef4f8;border:1px solid #cbd9e6;border-radius:14px;padding:13px 15px;margin:0 0 18px}.timeline{display:grid;gap:12px}.time-item{display:grid;grid-template-columns:52px 150px 1fr;gap:14px;border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff}.time-item.done{opacity:.68;background:#f5f7f5}.time-item.done h2{text-decoration:line-through}.time-check{display:flex;align-items:flex-start;justify-content:center;padding-top:3px}.time-check input{width:20px;height:20px}.time-item b{color:var(--gold);font-family:Georgia,serif}.time-item h2{font-size:22px;color:var(--navy);margin:0 0 8px}.time-item p{margin:0 0 7px;color:var(--muted)}.time-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.time-actions a{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-weight:800}.priority-now{border-left:5px solid var(--gold)}@media(max-width:760px){.time-controls{grid-template-columns:1fr 1fr}.time-item{grid-template-columns:42px 1fr}.time-item>div:nth-child(2){grid-column:2}}@media(max-width:520px){.time-controls{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">SN</span><span><strong>留學導航</strong><small>Study Abroad Navigator</small></span></a><nav class="desktop-nav"><a href="plan.html">我的規劃</a><a href="shortlist.html">申請清單</a><a href="eligibility.html">資格</a><a href="documents.html">文件</a><a href="timeline.html">時間表</a><a href="apply.html">申請</a></nav><a class="nav-cta" href="shortlist.html">我的申請清單</a></header><main><section class="page-intro"><span class="overline">Application Timeline</span><h1>不要等到截止日前才開始準備。</h1><p>依國家、科系、預計入學年度與英文狀態，把研究、測驗、作品、文件、送件、Offer 與簽證拆成可執行的順序；完成後直接打勾保存。</p></section><section class="time-shell"><div id="time-context" class="time-context"></div><div class="time-controls"><select id="t-country"><option value="">國家未定</option><option value="uk">英國</option><option value="canada">加拿大</option><option value="us">美國</option><option value="australia">澳洲</option><option value="europe">歐洲</option><option value="japan">日本</option><option value="singapore">新加坡</option><option value="hong-kong">香港</option></select><select id="t-major"><option value="">科系未定</option><option>Computer Science</option><option>Engineering</option><option>Business</option><option>Finance</option><option>Psychology</option><option>Medicine</option><option>Dentistry</option><option>Pharmacy</option><option>Biomedical Sciences</option><option>Art & Design</option><option>Animation</option><option>Film Production</option><option>Architecture</option><option>Music Performance</option><option>Music Production</option><option>AI</option><option>Data Science</option><option>Accounting</option><option>Fashion</option><option>Communication</option></select><select id="t-intake"><option value="2027">2027 入學</option><option value="2028">2028 入學</option><option value="2029">2029 入學</option></select><select id="t-english"><option value="">英文狀態未定</option><option>IELTS 7.0+／同等</option><option>IELTS 6.5 左右／同等</option><option>IELTS 6.0 左右／同等</option><option>目前約 IELTS 5.5／同等</option><option>尚未考英文</option></select></div><div id="time-progress" class="time-progress"></div><div id="timeline" class="timeline"></div></section></main><footer>
