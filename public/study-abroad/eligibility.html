<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我能不能申請？｜留學導航</title><meta name="description" content="依國家、科系、高中課程體系、成績與英文建立海外大學申請資格核對清單。"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mvp.css"><style>.elig-shell{max-width:1250px;margin:auto;padding:0 6vw 110px}.elig-form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.elig-form select{min-height:48px;border:1px solid var(--line);border-radius:11px;padding:0 10px;background:#fff}.elig-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.elig-card{border:1px solid var(--line);border-radius:20px;padding:22px;background:#fff}.elig-card h3{font-size:22px;color:var(--navy)}.elig-row{border-bottom:1px solid var(--line);padding:11px 0}.elig-row:last-child{border-bottom:0}.elig-row b{display:block;color:var(--navy);font-size:13px}.elig-row span{font-size:14px;color:var(--muted)}.elig-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.elig-actions a{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-weight:800}.elig-actions a:first-child{background:var(--navy);color:#fff}.warn{background:#fff7e9;border:1px solid #ead2a6;border-radius:14px;padding:14px;margin-top:12px}.ok{background:#eef7f2;border:1px solid #bdd9c8;border-radius:14px;padding:14px;margin-top:12px}@media(max-width:950px){.elig-form{grid-template-columns:1fr 1fr}.elig-grid{grid-template-columns:1fr}}@media(max-width:600px){.elig-form{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">SN</span><span><strong>留學導航</strong><small>Study Abroad Navigator</small></span></a><nav class="desktop-nav"><a href="student-start.html">從這裡開始</a><a href="plan.html">我的規劃</a><a href="universities.html">找大學</a><a href="documents.html">文件</a><a href="timeline.html">時間表</a><a href="apply.html">申請</a></nav><a class="nav-cta" href="universities.html">找大學</a></header><main><section class="page-intro"><span class="overline">Eligibility Check</span><h1>我能不能申請？先把條件逐項核對。</h1><p>這不是錄取率計算器。它的用途是把「學歷、先修、英文、測驗、作品／面試、文件」拆開，告訴你目前還缺哪一項確認。</p></section><section class="elig-shell"><div class="elig-form"><select id="e-country"><option value="">國家</option><option value="uk">英國</option><option value="canada">加拿大</option><option value="us">美國</option><option value="australia">澳洲</option><option value="europe">歐洲</option><option value="japan">日本</option><option value="singapore">新加坡</option><option value="hong-kong">香港</option></select><select id="e-major"><option value="">科系</option><option>Computer Science</option><option>AI</option><option>Data Science</option><option>Engineering</option><option>Business</option><option>Finance</option><option>Accounting</option><option>Economics</option><option>Psychology</option><option>Medicine</option><option>Dentistry</option><option>Pharmacy</option><option>Biomedical Sciences</option><option>Art & Design</option><option>Animation</option><option>Film Production</option><option>Architecture</option><option>Music Performance</option><option>Music Production</option><option>Fashion</option><option>Communication</option></select><select id="e-curriculum"><option value="">高中課程</option><option>台灣普通高中</option><option>OSSD</option><option>IB</option><option>A-Level</option><option>AP／美式高中</option><option>其他國際課程</option></select><select id="e-grade"><option value="">成績區間</option><option>90% 以上／A 水準</option><option>85–89%</option><option>80–84%</option><option>75–79%</option><option>70–74%</option><option>70% 以下</option></select><select id="e-english"><option value="">英文程度</option><option>IELTS 7.0+／同等</option><option>IELTS 6.5 左右／同等</option><option>IELTS 6.0 左右／同等</option><option>目前約 IELTS 5.5／同等</option><option>尚未考英文</option></select></div><div id="elig-result"></div></section></main><footer><div><strong>留學導航 Study Abroad Navigator</strong><p>Peter 的國際教育講座 × LTU 國際學術中心</p></div><div><p>正式資格仍需依當年度大學官方課程頁核對。</p></div></footer><script src="eligibility.js"></script><script src="study-cloud-sync.js"></script></body></html>
