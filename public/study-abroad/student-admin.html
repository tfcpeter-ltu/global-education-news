<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生會員管理｜環球教育新聞</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mvp.css"><style>.admin-shell{max-width:1240px;margin:auto;padding:48px 5vw 100px}.admin-card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);padding:24px;margin-bottom:18px}.admin-login{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;max-width:850px}.admin-login label{display:grid;gap:6px;font-weight:750;color:var(--navy)}.admin-login input{min-height:46px;padding:10px 12px;border:1px solid var(--line)}.admin-login button,.admin-toolbar button{min-height:46px;border:0;background:var(--navy);color:#fff;padding:10px 18px;font-weight:800;cursor:pointer}.admin-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.admin-toolbar input{flex:1;min-width:240px;min-height:46px;padding:10px 12px;border:1px solid var(--line)}.admin-toolbar button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.admin-status{font-weight:750;color:#7a351f}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary-grid strong{display:block;font-size:30px;color:var(--navy)}.table-wrap{overflow:auto;border:1px solid var(--line);background:#fff}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{position:sticky;top:0;background:var(--navy);color:#fff;white-space:nowrap}.yes{color:#27633f;font-weight:800}.no{color:#8b2f2f;font-weight:800}.empty{text-align:center;padding:32px}.hidden{display:none!important}@media(max-width:720px){.summary-grid,.admin-login{grid-template-columns:1fr}.admin-shell{padding:32px 18px 72px}}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">GE</span><span><strong>環球教育新聞</strong><small>Student Administration</small></span></a><nav class="desktop-nav"><a href="dashboard.html">留學 Dashboard</a></nav></header><main><section class="page-intro"><span class="overline">Administrator only</span><h1>學生會員管理</h1><p>查看已註冊學生、基本資料、通知偏好與查詢結果保存狀態。僅授權管理員可讀取。</p></section><section class="admin-shell"><article id="access-card" class="admin-card"><h2>管理員登入</h2><p id="admin-status" class="admin-status" aria-live="polite">正在確認登入狀態…</p><div id="admin-login" class="admin-login hidden"><label>管理員 Email<input id="admin-email" type="email" autocomplete="username" value="editor.jsti.ltu@gmail.com"></label><label>密碼<input id="admin-password" type="password" autocomplete="current-password"></label><button id="admin-login-button" type="button">登入管理後台</button></div></article><div id="admin-content" class="hidden"><section class="summary-grid" aria-label="會員摘要"><article class="admin-card"><span>註冊學生</span><strong id="total-count">0</strong></article><article class="admin-card"><span>Email 已驗證</span><strong id="verified-count">0</strong></article><article class="admin-card"><span>已保存查詢結果</span><strong id="saved-count">0</strong></article></section><section class="admin-card"><div class="admin-toolbar"><label class="hidden" for="student-search">搜尋學生</label><input id="student-search" type="search" placeholder="搜尋 Email、姓名、年級、課程或入學年度"><button id="refresh-button" type="button">重新整理</button><button id="admin-logout-button" class="secondary" type="button">登出管理後台</button></div><p id="result-count" aria-live="polite"></p></section><div class="table-wrap"><table><thead><tr><th>註冊時間</th><th>Email</th><th>姓名／稱呼</th><th>年級</th><th>課程體系</th><th>入學年度</th><th>Email 驗證</th><th>未滿 18 歲／監護同意</th><th>通知選擇</th><th>查詢結果</th><th>最近登入</th></tr></thead><tbody id="student-rows"></tbody></table><p id="empty-message" class="empty hidden">目前沒有符合條件的學生。</p></div></div></section></main><footer><div><strong>學生會員管理</strong><p>LTU 國際學術中心 × 環球教育新聞</p></div><div><p>請只為會員服務目的使用資料，並遵守個人資料與隱私說明。</p></div></footer><script src="study-cloud-sync.js"></script><script src="student-admin.js"></script></body></html>
